<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - P2P Marketplace | Buy & Sell USDT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0b0e11;
            --border-color: #1e2026;
            --accent-gold: #f0b90b;
            --text-main: #ffffff;
            --text-muted: #848e9c;
            --green: #0ecb81;
            --green-btn: #0ecb81;
            --red: #f6465d;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            padding-top: 70px;
            padding-bottom: 70px;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #0b0e11;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo-container img { height: 28px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a {
            color: #848e9c;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: var(--accent-gold);
            background: rgba(240, 185, 11, 0.08);
        }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .dashboard-shortcut-btn {
            background: rgba(240, 185, 11, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(240, 185, 11, 0.2);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .dashboard-shortcut-btn:hover { background: rgba(240, 185, 11, 0.2); }

        @media(max-width: 900px) {
            .nav-links { display: none; }
        }

        /* Market Container */
        .market-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px 20px 20px;
        }

        /* Buy / Sell Switch Tabs */
        .trade-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .toggle-btn {
            padding: 10px 35px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: #181a20;
            color: #848e9c;
            transition: all 0.2s ease;
        }
        .toggle-btn.active.buy-active {
            background: var(--green);
            color: #000;
        }
        .toggle-btn.active.sell-active {
            background: var(--red);
            color: #fff;
        }

        /* Filter Controls */
        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #181a20;
            border: none;
            color: #848e9c;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* 🚀 PC Table Styling (Default for Computers) 🚀 */
        .p2p-table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 20px 24px;
            border-bottom: 1px solid #14151a;
            vertical-align: middle;
        }
        th {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }
        tr:last-child td { border-bottom: none; }

        .advertiser-cell {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .avatar-box {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1c2027;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #2b313a;
        }
        .adv-name {
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .adv-name i { color: var(--accent-gold); font-size: 13px; }
        .adv-stats { font-size: 12px; color: #848e9c; }

        .price-cell { font-size: 20px; font-weight: 700; color: var(--green); }
        .limit-cell .available { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 4px; }
        .limit-cell .range { font-size: 12px; color: #848e9c; }

        .payment-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .pay-tag {
            background: #181a20;
            color: #848e9c;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #2b313a;
        }

        .action-cell { text-align: right; }
        .order-btn {
            background: var(--green-btn);
            color: #000000;
            padding: 10px 30px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
        }
        .order-btn.sell { background: var(--red); color: #fff; }
        .order-btn:hover { opacity: 0.9; }

        /* Classes for toggling views safely */
        .mobile-card-wrapper { display: none; }
        .pc-table-row { display: table-row; }

        /* 🚀 Strict Mobile Card Layout (Only active on screens <= 768px) 🚀 */
        @media(max-width: 768px) {
            body { padding-top: 55px; }
            .market-container { padding: 10px 8px; }
            .p2p-table-card { background: transparent; border: none; }
            table, thead, tbody, th, tr, td { display: block; width: 100%; box-sizing: border-box; }
            thead { display: none; }
            
            .pc-table-row { display: none !important; }
            .mobile-card-wrapper { display: block !important; }

            .m-card {
                background: var(--card-bg);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                margin-bottom: 12px;
                padding: 14px;
            }
            .m-top-row {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 10px;
            }
            .m-user-info { display: flex; align-items: center; gap: 10px; }
            .m-avatar {
                width: 36px; height: 36px; border-radius: 50%;
                background: #1c2027; display: flex; align-items: center;
                justify-content: center; color: var(--accent-gold);
                font-weight: bold; font-size: 13px; border: 1px solid #2b313a;
            }
            .m-name { font-weight: 700; font-size: 15px; color: #fff; display: flex; align-items: center; gap: 5px; }
            .m-stats { font-size: 11px; color: #848e9c; margin-top: 2px; }
            .m-right-side { text-align: right; }
            .m-price { font-size: 22px; font-weight: 800; line-height: 1; }
            .m-currency { font-size: 10px; color: #848e9c; text-transform: uppercase; margin-top: 3px; }
            
            .m-middle-row { margin: 10px 0; font-size: 12px; color: #848e9c; }
            .m-middle-row .avail { color: #fff; font-weight: 600; margin-top: 2px; }
            
            .m-bottom-row {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid #14151a;
            }
            .m-payment-tags { display: flex; gap: 5px; flex-wrap: wrap; max-width: 65%; }
            .m-pay-tag {
                background: #14171d; color: #848e9c; padding: 3px 8px;
                border-radius: 8px; font-size: 10px; border: 1px solid #2b313a;
            }
            .m-order-btn { padding: 7px 22px; font-size: 13px; border-radius: 6px; font-weight: 700; border: none; cursor: pointer; }
            .m-order-btn.buy { background: var(--green-btn); color: #000; }
            .m-order-btn.sell { background: var(--red); color: #fff; }
        }

        /* Order Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-box {
            background: #16181d; border: 1px solid var(--border-color);
            border-radius: 12px; width: 90%; max-width: 400px;
            padding: 24px; box-sizing: border-box;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .modal-header h3 { margin: 0; font-size: 16px; color: #fff; }
        .modal-header i { cursor: pointer; color: #848e9c; font-size: 18px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #848e9c; margin-bottom: 6px; }
        .input-control {
            width: 100%; background: #0d0f12; border: 1px solid #2b313a;
            color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <img src="logo.png" alt="TBR Exchange Logo" onerror="this.style.display='none'">
            </div>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html" class="active"><i class="fa-solid fa-store"></i> Market</a>
                <a href="my-ads.html"><i class="fa-solid fa-bullhorn"></i> My Ads</a>
                <a href="trades.html"><i class="fa-solid fa-right-left"></i> Trades</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
            </div>
        </div>
        <div class="nav-right">
            <a href="dashboard.html" class="dashboard-shortcut-btn" title="Go to Dashboard">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
    </div>

    <!-- Main Market Section -->
    <div class="market-container">
        
        <div class="trade-toggle-wrap">
            <button id="buyTabBtn" class="toggle-btn active buy-active" onclick="switchTradeType('buy')">Buy</button>
            <button id="sellTabBtn" class="toggle-btn" onclick="switchTradeType('sell')">Sell</button>
        </div>

        <div class="filter-row">
            <button class="filter-btn"><i class="fa-solid fa-circle" style="font-size: 6px; color: var(--green);"></i> Online</button>
            <button class="filter-btn">Amount <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left:4px;"></i></button>
            <button class="filter-btn">Payment Method <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left:4px;"></i></button>
        </div>

        <!-- Orders Table / Mobile Card Grid -->
        <div class="p2p-table-card">
            <table>
                <thead>
                    <tr>
                        <th>Advertiser</th>
                        <th>Price</th>
                        <th>Available / Limit</th>
                        <th>Payment</th>
                        <th style="text-align: right;">Action</th>
                    </tr>
                </thead>
                <tbody id="p2pOrdersBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px;">
                            <i class="fa-solid fa-circle-notch fa-spin"></i> Loading live orders...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Order Action Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Create P2P Order</h3>
                <i class="fa-solid fa-xmark" onclick="closeOrderModal()"></i>
            </div>
            <div class="form-group">
                <label>Unit Price</label>
                <input type="text" class="input-control" id="modalPriceInput" readonly>
            </div>
            <div class="form-group">
                <label>Amount (USDT)</label>
                <input type="number" class="input-control" id="modalAmountInput" placeholder="Enter amount">
            </div>
            <button id="modalConfirmBtn" class="order-btn" style="width: 100%; margin-top: 15px; padding: 14px;" onclick="confirmTrade()">Proceed Trade</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://tbr-exchange-backend.onrender.com';
        let currentType = 'buy';

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab');
            const initialType = urlParams.get('type');

            if (activeTab === 'sell' || initialType === 'sell') {
                switchTradeType('sell');
            } else if (activeTab === 'buy' || initialType === 'buy') {
                switchTradeType('buy');
            } else {
                fetchSettingsAndRender();
            }
        });

        function switchTradeType(type) {
            currentType = type;
            const buyBtn = document.getElementById('buyTabBtn');
            const sellBtn = document.getElementById('sellTabBtn');

            if (type === 'buy') {
                buyBtn.className = 'toggle-btn active buy-active';
                sellBtn.className = 'toggle-btn';
            } else {
                sellBtn.className = 'toggle-btn active sell-active';
                buyBtn.className = 'toggle-btn';
            }

            fetchSettingsAndRender();
        }

        async function fetchSettingsAndRender() {
            renderOrderBook();
        }

        async function renderOrderBook() {
            const tbody = document.getElementById('p2pOrdersBody');
            const isBuy = currentType === 'buy';
            
            const actionLabel = isBuy ? 'Buy' : 'Sell';
            const btnClass = isBuy ? 'order-btn' : 'order-btn sell';
            const mobileBtnClass = isBuy ? 'm-order-btn buy' : 'm-order-btn sell';

            let serverAds = [];
            try {
                const res = await fetch(`${API_BASE}/api/ads`);
                const json = await res.json();
                if (json.success && json.ads) {
                    serverAds = json.ads;
                }
            } catch (err) {
                console.error("Error fetching live ads:", err);
            }

            let filteredAds = serverAds.filter(ad => {
                if (isBuy) return ad.tradeType === 'sell';
                else return ad.tradeType === 'buy';
            }).map(ad => {
                let payMethods = ad.paymentMethods || ['Telebirr'];
                if (typeof payMethods === 'string') {
                    try { payMethods = JSON.parse(payMethods); } catch(e) { payMethods = [payMethods]; }
                }
                if (!Array.isArray(payMethods)) payMethods = [payMethods];

                return {
                    name: ad.name || 'Trader',
                    verified: true,
                    orders: ad.ordersCount || 1,
                    comp: ad.completionRate || '100%',
                    customPrice: typeof ad.price === 'number' ? ad.price.toFixed(2) : parseFloat(ad.price || 0).toFixed(2),
                    avail: Number(ad.totalAmount || 0).toLocaleString('en-US'),
                    min: Number(ad.minLimit || 0).toLocaleString('en-US'),
                    max: Number(ad.maxLimit || 0).toLocaleString('en-US'),
                    pay: payMethods
                };
            });

            let html = '';
            filteredAds.forEach(t => {
                const effectivePrice = t.customPrice;
                let payTagsHTML = t.pay.map(p => `<span class="pay-tag">${p}</span>`).join('');
                let mPayTagsHTML = t.pay.map(p => `<span class="m-pay-tag">${p}</span>`).join('');

                html += `
                <!-- PC Table Row View -->
                <tr class="pc-table-row">
                    <td>
                        <div class="advertiser-cell">
                            <div class="avatar-box">${t.name.charAt(0).toUpperCase()}</div>
                            <div>
                                <div class="adv-name">${t.name} ${t.verified ? '<i class="fa-solid fa-circle-check"></i>' : ''}</div>
                                <div class="adv-stats">${t.orders} trades &bull; ${t.comp}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="price-cell" style="color: ${isBuy ? 'var(--green)' : 'var(--red)'};">${effectivePrice} <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">ETB</span></div>
                    </td>
                    <td>
                        <div class="limit-cell">
                            <div class="available">${t.avail} USDT</div>
                            <div class="range">Limit: ${t.min} - ${t.max} ETB</div>
                        </div>
                    </td>
                    <td>
                        <div class="payment-tags">
                            ${payTagsHTML}
                        </div>
                    </td>
                    <td class="action-cell">
                        <button class="${btnClass}" onclick="openOrderModal('${actionLabel}', '${effectivePrice}')">${actionLabel}</button>
                    </td>
                </tr>

                <!-- Mobile Card View -->
                <tr class="mobile-card-wrapper">
                    <td>
                        <div class="m-card">
                            <div class="m-top-row">
                                <div class="m-user-info">
                                    <div class="m-avatar">${t.name.charAt(0).toUpperCase()}</div>
                                    <div>
                                        <div class="m-name">${t.name} ${t.verified ? '<i class="fa-solid fa-circle-check" style="font-size:12px; color:var(--accent-gold);"></i>' : ''}</div>
                                        <div class="m-stats">${t.orders} trades &bull; ${t.comp}</div>
                                    </div>
                                </div>
                                <div class="m-right-side">
                                    <div class="m-price" style="color: ${isBuy ? 'var(--green)' : 'var(--red)'};">${effectivePrice}</div>
                                    <div class="m-currency">ETB / USDT</div>
                                </div>
                            </div>
                            
                            <div class="m-middle-row">
                                <div>Limit: ${t.min} - ${t.max} ETB</div>
                                <div class="avail">Avail: ${t.avail} USDT</div>
                            </div>

                            <div class="m-bottom-row">
                                <div class="m-payment-tags">
                                    ${mPayTagsHTML}
                                </div>
                                <button class="${mobileBtnClass}" onclick="openOrderModal('${actionLabel}', '${effectivePrice}')">${actionLabel}</button>
                            </div>
                        </div>
                    </td>
                </tr>`;
            });

            if (filteredAds.length === 0) {
                html = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px 0;">No active ads found in the market right now.</td></tr>`;
            }

            tbody.innerHTML = html;
        }

        function openOrderModal(action, price) {
            document.getElementById('modalTitle').innerText = `${action} USDT via Escrow`;
            document.getElementById('modalPriceInput').value = `${price} ETB`;
            document.getElementById('modalConfirmBtn').innerText = `Confirm ${action}`;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function confirmTrade() {
            const amount = document.getElementById('modalAmountInput').value;
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount.');
                return;
            }
            alert(`Order initiated for ${amount} USDT! Transferring to secure Escrow Trade room...`);
            closeOrderModal();
            window.location.href = 'trades.html';
        }
    </script>
</body>
</html>
