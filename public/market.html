<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - P2P Marketplace | Buy & Sell USDT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #000000;
            --border-color: #1e2026;
            --accent-gold: #f0b90b;
            --text-main: #ffffff;
            --text-muted: #5e6673;
            --green: #0ecb81;
            --green-btn: #1dd79b;
            --red: #f6465d;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            padding-top: 70px;
            padding-bottom: 70px;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #0b0e11;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo-container img { height: 28px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a {
            color: #848e9c;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: var(--accent-gold);
            background: rgba(240, 185, 11, 0.08);
        }
        .nav-right { display: flex; align-items: center; gap: 15px; }

        @media(max-width: 900px) {
            .nav-links { display: none; }
        }

        /* Market Container */
        .market-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 20px 20px 20px;
        }

        /* Buy / Sell Switch Tabs */
        .trade-toggle-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .toggle-btn {
            padding: 10px 35px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: #181a20;
            color: #848e9c;
            transition: all 0.2s ease;
        }
        .toggle-btn.active.buy-active {
            background: var(--green);
            color: #000;
        }
        .toggle-btn.active.sell-active {
            background: var(--red);
            color: #fff;
        }

        /* Filter Controls */
        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #181a20;
            border: none;
            color: #848e9c;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* Market Table Styling */
        .p2p-table-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 900px;
        }
        th {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            padding: 20px 24px;
            border-bottom: 1px solid #14151a;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        td {
            padding: 24px;
            border-bottom: 1px solid #14151a;
            vertical-align: middle;
        }
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        tr:last-child td {
            border-bottom: none;
        }

        /* Columns Content */
        .advertiser-cell {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .avatar-wrap {
            position: relative;
        }
        .avatar-box {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #1c2027;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #2b313a;
        }
        .online-dot {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background-color: var(--green);
            border-radius: 50%;
            border: 2px solid var(--card-bg);
        }
        .adv-name {
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .adv-name i {
            color: var(--accent-gold);
            font-size: 13px;
        }
        .adv-stats {
            font-size: 12px;
            color: #848e9c;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .adv-stats i {
            color: var(--accent-gold);
            font-size: 11px;
        }
        .sponsored-badge {
            display: inline-block;
            background: rgba(240, 185, 11, 0.15);
            color: var(--accent-gold);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 6px;
        }

        .price-cell {
            font-size: 22px;
            font-weight: 700;
            color: var(--green);
        }

        .payment-cell {
            max-width: 350px;
        }
        .payment-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .pay-tag {
            background: #181a20;
            color: #848e9c;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid #2b313a;
        }

        .action-cell {
            text-align: right;
        }
        .order-btn {
            background: var(--green-btn);
            color: #ffffff;
            padding: 10px 30px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
        }
        .order-btn.sell {
            background: var(--red);
        }
        .order-btn:hover {
            opacity: 0.9;
        }

        /* Order Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-box {
            background: #16181d;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 400px;
            padding: 24px;
            box-sizing: border-box;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }
        .modal-header h3 { margin: 0; font-size: 16px; color: #fff; }
        .modal-header i { cursor: pointer; color: #848e9c; font-size: 18px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #848e9c; margin-bottom: 6px; }
        .input-control {
            width: 100%;
            background: #0d0f12;
            border: 1px solid #2b313a;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <div class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <img src="logo.png" alt="TBR Exchange Logo" onerror="this.style.display='none'">
            </div>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html" class="active"><i class="fa-solid fa-store"></i> Market</a>
                <a href="my-ads.html"><i class="fa-solid fa-bullhorn"></i> My Ads</a>
                <a href="trades.html"><i class="fa-solid fa-right-left"></i> Trades</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
            </div>
        </div>
        <div class="nav-right">
        </div>
    </div>

    <!-- Main Market Section -->
    <div class="market-container">
        
        <div class="trade-toggle-wrap">
            <button id="buyTabBtn" class="toggle-btn active buy-active" onclick="switchTradeType('buy')">Buy</button>
            <button id="sellTabBtn" class="toggle-btn" onclick="switchTradeType('sell')">Sell</button>
        </div>

        <div class="filter-row">
            <button class="filter-btn"><i class="fa-solid fa-circle" style="font-size: 6px; color: var(--green);"></i> Online</button>
            <button class="filter-btn">Amount <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left:4px;"></i></button>
            <button class="filter-btn">Payment Method <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left:4px;"></i></button>
        </div>

        <!-- Orders Table -->
        <div class="p2p-table-card">
            <table>
                <thead>
                    <tr>
                        <th>Advertiser</th>
                        <th>Price</th>
                        <th>Payment</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="p2pOrdersBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px;">
                            <i class="fa-solid fa-circle-notch fa-spin"></i> Loading live orders...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Order Action Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Create P2P Order</h3>
                <i class="fa-solid fa-xmark" onclick="closeOrderModal()"></i>
            </div>
            <div class="form-group">
                <label>Unit Price</label>
                <input type="text" class="input-control" id="modalPriceInput" readonly>
            </div>
            <div class="form-group">
                <label>Amount (USDT)</label>
                <input type="number" class="input-control" id="modalAmountInput" placeholder="Enter amount">
            </div>
            <button id="modalConfirmBtn" class="order-btn" style="width: 100%; margin-top: 15px; padding: 14px;" onclick="confirmTrade()">Proceed Trade</button>
        </div>
    </div>

    <script>
        let currentType = 'buy';

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialType = urlParams.get('type');
            if (initialType === 'sell') {
                switchTradeType('sell');
            } else {
                renderOrderBook();
            }
        });

        function switchTradeType(type) {
            currentType = type;
            const buyBtn = document.getElementById('buyTabBtn');
            const sellBtn = document.getElementById('sellTabBtn');

            if (type === 'buy') {
                buyBtn.className = 'toggle-btn active buy-active';
                sellBtn.className = 'toggle-btn';
            } else {
                sellBtn.className = 'toggle-btn active sell-active';
                buyBtn.className = 'toggle-btn';
            }

            renderOrderBook();
        }

        function renderOrderBook() {
            const tbody = document.getElementById('p2pOrdersBody');
            const actionLabel = 'Buy';
            const btnClass = 'order-btn';

            const sampleTraders = [
                { name: 'EBRWhale', verified: true, orders: '1155 trades', comp: '95%', price: '200', pay: ['CBE Birr', 'Bank of Abyssinia', 'Telebirr', 'Commercial Bank of Ethiopia'], sponsored: true, avatar: '🦮' },
                { name: 'Brothernuge', verified: true, orders: '888 trades', comp: '87%', price: '193', pay: ['M-Pesa', 'CBE Birr', 'Awash Bank', 'Dashen Bank', 'Bank of Abyssinia', 'Telebirr'], sponsored: false, avatar: '🛡️' },
                { name: 'EarnNexus', verified: true, orders: '457 trades', comp: '94%', price: '193.4', pay: ['CBE Birr', 'Bank of Abyssinia', 'Commercial Bank of Ethiopia', 'Telebirr', 'Dashen Bank'], sponsored: false, avatarInit: 'EA' },
                { name: 'Trader#01376', verified: false, orders: '304 trades', comp: '92%', price: '193.4', pay: ['Commercial Bank of Ethiopia', 'Telebirr'], sponsored: false, avatarInit: 'TR' }
            ];

            let html = '';
            sampleTraders.forEach(t => {
                const avatarContent = t.avatar ? t.avatar : t.avatarInit;
                
                html += `
                <tr>
                    <td>
                        <div class="advertiser-cell">
                            <div class="avatar-wrap">
                                <div class="avatar-box">${avatarContent}</div>
                                <div class="online-dot"></div>
                            </div>
                            <div>
                                <div class="adv-name">${t.name} ${t.verified ? '<i class="fa-solid fa-circle-check"></i>' : ''}</div>
                                <div class="adv-stats">
                                    <span style="color:var(--accent-gold);">★ ${t.comp}</span> &nbsp; ${t.orders}
                                </div>
                                ${t.sponsored ? '<div class="sponsored-badge">SPONSORED</div>' : ''}
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="price-cell">${t.price}</div>
                    </td>
                    <td class="payment-cell">
                        <div class="payment-tags">
                            ${t.pay.map(p => `<span class="pay-tag">${p}</span>`).join('')}
                        </div>
                    </td>
                    <td class="action-cell">
                        <button class="${btnClass}" onclick="openOrderModal('${actionLabel}', '${t.price}')">${actionLabel}</button>
                    </td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        function openOrderModal(action, price) {
            document.getElementById('modalTitle').innerText = `${action} USDT via Escrow`;
            document.getElementById('modalPriceInput').value = `${price} ETB`;
            document.getElementById('modalConfirmBtn').innerText = `Confirm ${action}`;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function confirmTrade() {
            const amount = document.getElementById('modalAmountInput').value;
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount.');
                return;
            }
            alert(`Order initiated for ${amount} USDT! Transferring to secure Escrow Trade room...`);
            closeOrderModal();
            window.location.href = 'trades.html';
        }
    </script>
</body>
</html>
