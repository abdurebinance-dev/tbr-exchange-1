<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - Account Settings</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
            --accent-color: #f3ba2f;
            --green-color: #0ecb81;
            --orange-color: #f0b90b;
            --red-color: #f6465d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .settings-container {
            max-width: 1100px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .settings-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .settings-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 3px 0;
        }

        .settings-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        .dashboard-btn {
            background: #1a1a1a;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: all 0.08s ease;
        }

        .dashboard-btn:hover {
            background: var(--accent-color);
            color: #000;
        }

        .settings-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            padding-bottom: 8px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.08s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        button, .action-link, .tab-btn, .camera-badge, i.fa-copy, i.fa-pen, .edit-icon, .badge-verified, .badge-unverified, .dashboard-btn {
            transition: transform 0.08s ease, opacity 0.08s ease;
        }

        button:active, .action-link:active, .tab-btn:active, .camera-badge:active, .edit-icon:active, i.fa-copy:active, .badge-verified:active, .dashboard-btn:active {
            transform: scale(0.90) !important;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px 25px;
            margin-bottom: 15px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .avatar-box {
            position: relative;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #f3ba2f, #d4af37);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }

        .avatar-box .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #222;
            color: #fff;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            border: 2px solid var(--card-bg);
            cursor: pointer;
        }

        .user-info h3 {
            margin: 0 0 3px 0;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info .id-container {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .edit-icon {
            color: var(--accent-color);
            cursor: pointer;
            font-size: 13px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 500;
        }

        .badge-verified {
            color: var(--green-color);
            background: rgba(14, 203, 129, 0.1);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(14, 203, 129, 0.2);
        }

        .badge-unverified {
            color: var(--orange-color);
            background: rgba(240, 185, 11, 0.1);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(240, 185, 11, 0.2);
        }

        .action-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-block;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .custom-modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 350px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .custom-modal h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--text-color);
            margin-bottom: 12px;
        }

        .custom-modal input {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .custom-modal input:focus {
            border-color: var(--accent-color);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-btn {
            padding: 6px 14px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: transform 0.08s ease;
        }

        .modal-btn:active {
            transform: scale(0.92);
        }

        .btn-cancel {
            background: #222;
            color: var(--text-muted);
        }

        .btn-confirm {
            background: var(--accent-color);
            color: #000;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="settings-container">
        <div class="settings-top-bar">
            <div class="settings-header">
                <h1>Account Settings</h1>
                <p>Manage your profile, security credentials, and preferences.</p>
            </div>
            <a href="index.html" class="dashboard-btn"><i class="fa-solid fa-house"></i> Dashboard</a>
        </div>

        <div class="settings-tabs">
            <button class="tab-btn active"><i class="fa-solid fa-user"></i> Profile</button>
            <button class="tab-btn" onclick="location.href='security.html'"><i class="fa-solid fa-shield-halved"></i> Security</button>
            <button class="tab-btn"><i class="fa-solid fa-wallet"></i> Payments</button>
            <button class="tab-btn"><i class="fa-solid fa-gear"></i> Account</button>
            <button class="tab-btn"><i class="fa-solid fa-right-left"></i> Trades</button>
        </div>

        <div class="profile-card">
            <div class="profile-top">
                <div class="avatar-box" id="avatar-initials">
                    UI
                    <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
                </div>
                <div class="user-info">
                    <h3 id="profile-name">Loading... <i class="fa-solid fa-pen edit-icon" onclick="openModal('name')"></i></h3>
                    <div class="id-container">
                        <span id="profile-id">Loading...</span> 
                        <i class="fa-solid fa-copy" style="cursor:pointer;" title="Copy ID" onclick="copyId()"></i>
                    </div>
                </div>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">Email</div>
                    <div class="info-value" id="profile-email">Loading...</div>
                </div>
                <span class="badge-verified"><i class="fa-solid fa-check"></i> Verified</span>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">KYC Status</div>
                    <div class="info-value" id="kyc-text">Identity Verification</div>
                </div>
                <span id="kyc-badge" class="badge-unverified"><i class="fa-solid fa-clock"></i> Unverified</span>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">Phone Number</div>
                    <div class="info-value" id="phone-display">Not added</div>
                </div>
                <span class="action-link" onclick="openModal('phone')"><i class="fa-solid fa-plus"></i> Add</span>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">Trader Username</div>
                    <div class="info-value" id="username-display">Not set — tap to choose your handle</div>
                </div>
                <span class="action-link" onclick="openModal('username')"><i class="fa-solid fa-pen"></i> Edit</span>
            </div>
        </div>
    </div>

    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal">
            <h3 id="modalTitle">Update Info</h3>
            <input type="text" id="modalInput" placeholder="Enter value...">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-confirm" onclick="saveModalData()">Save</button>
            </div>
        </div>
    </div>

    <!-- Enhanced Script with Cache Busting & Multi-Token Support -->
    <script>
        let currentField = "";

        document.addEventListener("DOMContentLoaded", async function() {
            try {
                // Support multiple token keys used across different pages
                const token = localStorage.getItem("token") || 
                              localStorage.getItem("authToken") || 
                              localStorage.getItem("access_token");
                
                // Add timestamp (?t=...) to prevent 304 browser caching issues
                const response = await fetch(`https://tbr-exchange-backend.onrender.com/api/user/profile?t=${new Date().getTime()}`, {
                    method: "GET",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": token ? `Bearer ${token}` : ""
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    const username = data.username || data.name || data.fullName || "";
                    const email = data.email || "";
                    const tbrId = data.tbrId || data.id || data.userId || "";
                    const phone = data.phone || data.phoneNumber;
                    const traderHandle = data.traderUsername;
                    
                    const isVerified = data.kycVerified === true || data.kycStatus === 'verified' || data.kyc_status === 'VERIFIED';

                    // Save to localStorage so fallback retains correct user data next time
                    localStorage.setItem("kycVerified", isVerified);
                    if (tbrId) localStorage.setItem("userId", tbrId);
                    if (username) localStorage.setItem("userName", username);
                    if (email) localStorage.setItem("userEmail", email);

                    updateUI({
                        username,
                        email,
                        tbrId,
                        phone,
                        traderHandle,
                        isVerified
                    });
                } else {
                    console.warn("Server responded with status:", response.status);
                    loadFromLocalStorageFallback();
                }
            } catch (error) {
                console.error("Fetch error, using fallback:", error);
                loadFromLocalStorageFallback();
            }
        });

        function updateUI(user) {
            document.getElementById("profile-name").innerHTML = `${user.username || 'User'} <i class="fa-solid fa-pen edit-icon" onclick="openModal('name')"></i>`;
            document.getElementById("profile-email").innerText = user.email || 'No email';
            document.getElementById("profile-id").innerText = user.tbrId || 'TBR-000000';
            
            if(user.username && user.username.length > 0) {
                document.getElementById("avatar-initials").innerHTML = `${user.username.substring(0,2).toUpperCase()} <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>`;
            }

            if(user.phone) {
                document.getElementById("phone-display").innerText = user.phone;
            }
            if(user.traderHandle) {
                document.getElementById("username-display").innerText = user.traderHandle;
            }

            const kycBadge = document.getElementById("kyc-badge");
            if(user.isVerified) {
                kycBadge.className = "badge-verified";
                kycBadge.innerHTML = `<i class="fa-solid fa-check"></i> Verified`;
            } else {
                kycBadge.className = "badge-unverified";
                kycBadge.innerHTML = `<i class="fa-solid fa-clock"></i> Unverified`;
            }
        }

        function loadFromLocalStorageFallback() {
            const username = localStorage.getItem("userName") || "";
            const email = localStorage.getItem("userEmail") || "";
            const tbrId = localStorage.getItem("userId") || localStorage.getItem("tbrId") || "";
            const phone = localStorage.getItem("userPhone");
            const traderHandle = localStorage.getItem("traderUsername");
            const isVerified = localStorage.getItem("kycVerified") === "true";

            updateUI({ username, email, tbrId, phone, traderHandle, isVerified });
        }

        function openModal(field) {
            currentField = field;
            const modal = document.getElementById("customModal");
            const title = document.getElementById("modalTitle");
            const input = document.getElementById("modalInput");
            
            modal.style.display = "flex";
            input.value = "";

            if(field === 'phone') {
                title.innerText = "Add Phone Number";
                input.placeholder = "e.g. +251911223344";
            } else if(field === 'username') {
                title.innerText = "Set Trader Username";
                input.placeholder = "Enter handle...";
            } else if(field === 'name') {
                title.innerText = "Edit Profile Name";
                input.value = document.getElementById("profile-name").innerText.trim();
            }
            input.focus();
        }

        function closeModal() {
            document.getElementById("customModal").style.display = "none";
        }

        async function saveModalData() {
            const val = document.getElementById("modalInput").value.trim();
            if(!val) return;

            if(currentField === 'phone') {
                document.getElementById("phone-display").innerText = val;
                localStorage.setItem("userPhone", val);
            } else if(currentField === 'username') {
                document.getElementById("username-display").innerText = val;
                localStorage.setItem("traderUsername", val);
            } else if(currentField === 'name') {
                localStorage.setItem("userName", val);
                document.getElementById("profile-name").innerHTML = `${val} <i class="fa-solid fa-pen edit-icon" onclick="openModal('name')"></i>`;
                if(val.length > 0) {
                    document.getElementById("avatar-initials").innerHTML = `${val.substring(0,2).toUpperCase()} <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>`;
                }
            }
            
            try {
                const token = localStorage.getItem("token") || localStorage.getItem("authToken") || localStorage.getItem("access_token");
                await fetch("https://tbr-exchange-backend.onrender.com/api/user/update", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": token ? `Bearer ${token}` : ""
                    },
                    body: JSON.stringify({ field: currentField, value: val })
                });
            } catch (e) {
                console.error("Failed to sync update with backend:", e);
            }

            closeModal();
        }

        function copyId() {
            let idText = document.getElementById("profile-id").innerText;
            navigator.clipboard.writeText(idText);
            alert("Account ID copied to clipboard!");
        }
    </script>
</body>
</html>
