<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - Account Settings</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #222222;
            --accent-color: #f3ba2f;
            --green-color: #0ecb81;
            --red-color: #f6465d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .settings-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .settings-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .settings-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Tabs Navigation */
        .settings-tabs {
            display: flex;
            gap: 25px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            padding-bottom: 12px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            transition: all 0.1s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
        }

        /* Strong Click Scale Down Effect for ALL Interactive Elements */
        button, .action-link, .tab-btn, .camera-badge, i.fa-copy, i.fa-pen, .edit-icon, .badge-verified {
            transition: transform 0.08s ease, opacity 0.08s ease;
        }

        button:active, .action-link:active, .tab-btn:active, .camera-badge:active, .edit-icon:active, i.fa-copy:active, .badge-verified:active {
            transform: scale(0.90) !important;
        }

        /* Profile Card Section & Alignment Fixes */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .avatar-box {
            position: relative;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #f3ba2f, #d4af37);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: bold;
            color: #000;
            flex-shrink: 0;
        }

        .avatar-box .camera-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #222;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border: 2px solid var(--card-bg);
            cursor: pointer;
        }

        .user-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info .id-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 13px;
            background: rgba(255, 255, 255, 0.03);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .edit-icon {
            color: var(--accent-color);
            cursor: pointer;
            font-size: 14px;
        }

        /* Info Rows - Perfectly aligned */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 500;
        }

        .badge-verified {
            color: var(--green-color);
            background: rgba(14, 203, 129, 0.1);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid rgba(14, 203, 129, 0.2);
        }

        .action-link {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-block;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        /* Custom Styled Modal for Inputs */
        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }

        .custom-modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 380px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .custom-modal h3 {
            margin-top: 0;
            font-size: 18px;
            color: var(--text-color);
            margin-bottom: 15px;
        }

        .custom-modal input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }

        .custom-modal input:focus {
            border-color: var(--accent-color);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: transform 0.08s ease;
        }

        .modal-btn:active {
            transform: scale(0.92);
        }

        .btn-cancel {
            background: #222;
            color: var(--text-muted);
        }

        .btn-confirm {
            background: var(--accent-color);
            color: #000;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <div class="settings-container">
        <div class="settings-header">
            <h1>Account Settings</h1>
            <p>Manage your profile, security credentials, and preferences.</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="settings-tabs">
            <button class="tab-btn active"><i class="fa-solid fa-user"></i> Profile</button>
            <button class="tab-btn" onclick="location.href='security.html'"><i class="fa-solid fa-shield-halved"></i> Security</button>
            <button class="tab-btn"><i class="fa-solid fa-wallet"></i> Payments</button>
            <button class="tab-btn"><i class="fa-solid fa-gear"></i> Account</button>
            <button class="tab-btn"><i class="fa-solid fa-right-left"></i> Trades</button>
        </div>

        <!-- Profile Content Box -->
        <div class="profile-card">
            <div class="profile-top">
                <div class="avatar-box" id="avatar-initials">
                    BI
                    <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
                </div>
                <div class="user-info">
                    <h3 id="profile-name">binanceme73 <i class="fa-solid fa-pen edit-icon" onclick="openModal('name')"></i></h3>
                    <div class="id-container">
                        <span id="profile-id">TBR-961371</span> 
                        <i class="fa-solid fa-copy" style="cursor:pointer;" title="Copy ID" onclick="copyId()"></i>
                    </div>
                </div>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">Email</div>
                    <div class="info-value" id="profile-email">binanceme73@gmail.com</div>
                </div>
                <span class="badge-verified"><i class="fa-solid fa-check"></i> Verified</span>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">KYC Status</div>
                    <div class="info-value">Identity Verification</div>
                </div>
                <span class="badge-verified"><i class="fa-solid fa-check"></i> Verified</span>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">Phone Number</div>
                    <div class="info-value" id="phone-display">Not added</div>
                </div>
                <span class="action-link" onclick="openModal('phone')"><i class="fa-solid fa-plus"></i> Add</span>
            </div>

            <div class="info-row">
                <div>
                    <div class="info-title">Trader Username</div>
                    <div class="info-value" id="username-display">Not set — tap to choose your handle</div>
                </div>
                <span class="action-link" onclick="openModal('username')"><i class="fa-solid fa-pen"></i> Edit</span>
            </div>
        </div>
    </div>

    <!-- Custom Styled Modal Box -->
    <div class="custom-modal-overlay" id="customModal">
        <div class="custom-modal">
            <h3 id="modalTitle">Update Info</h3>
            <input type="text" id="modalInput" placeholder="Enter value...">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn btn-confirm" onclick="saveModalData()">Save</button>
            </div>
        </div>
    </div>

    <!-- Scripting for Dynamic Data, Click Effects & Custom Modal -->
    <script>
        let currentField = "";

        document.addEventListener("DOMContentLoaded", function() {
            const savedName = localStorage.getItem("userName") || "binanceme73";
            const savedEmail = localStorage.getItem("userEmail") || "binanceme73@gmail.com";
            const savedId = localStorage.getItem("userId") || "TBR-961371";
            const savedPhone = localStorage.getItem("userPhone");
            const savedUsername = localStorage.getItem("traderUsername");

            document.getElementById("profile-name").innerHTML = `${savedName} <i class="fa-solid fa-pen edit-icon" onclick="openModal('name')"></i>`;
            document.getElementById("profile-email").innerText = savedEmail;
            document.getElementById("profile-id").innerText = savedId;
            
            if(savedName.length > 0) {
                document.getElementById("avatar-initials").innerHTML = `${savedName.substring(0,2).toUpperCase()} <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>`;
            }

            if(savedPhone) {
                document.getElementById("phone-display").innerText = savedPhone;
            }
            if(savedUsername) {
                document.getElementById("username-display").innerText = savedUsername;
            }
        });

        function openModal(field) {
            currentField = field;
            const modal = document.getElementById("customModal");
            const title = document.getElementById("modalTitle");
            const input = document.getElementById("modalInput");
            
            modal.style.display = "flex";
            input.value = "";

            if(field === 'phone') {
                title.innerText = "Add Phone Number";
                input.placeholder = "e.g. +251911223344";
            } else if(field === 'username') {
                title.innerText = "Set Trader Username";
                input.placeholder = "Enter handle...";
            } else if(field === 'name') {
                title.innerText = "Edit Profile Name";
                input.value = localStorage.getItem("userName") || "binanceme73";
            }
            input.focus();
        }

        function closeModal() {
            document.getElementById("customModal").style.display = "none";
        }

        function saveModalData() {
            const val = document.getElementById("modalInput").value.trim();
            if(!val) return;

            if(currentField === 'phone') {
                document.getElementById("phone-display").innerText = val;
                localStorage.setItem("userPhone", val);
            } else if(currentField === 'username') {
                document.getElementById("username-display").innerText = val;
                localStorage.setItem("traderUsername", val);
            } else if(currentField === 'name') {
                localStorage.setItem("userName", val);
                document.getElementById("profile-name").innerHTML = `${val} <i class="fa-solid fa-pen edit-icon" onclick="openModal('name')"></i>`;
                if(val.length > 0) {
                    document.getElementById("avatar-initials").innerHTML = `${val.substring(0,2).toUpperCase()} <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>`;
                }
            }
            closeModal();
        }

        function copyId() {
            let idText = document.getElementById("profile-id").innerText;
            navigator.clipboard.writeText(idText);
            alert("Account ID copied to clipboard!");
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
