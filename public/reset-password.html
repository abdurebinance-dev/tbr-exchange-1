<script src="auth-guard.js"></script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - Reset Password</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
    <link rel="shortcut icon" type="image/png" href="/icon-192.png?v=3">
    <link rel="apple-touch-icon" href="/icon-192.png?v=3">
    <link rel="manifest" href="/manifest.json?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #080808; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
        .form-container { background: #121212; border: 1px solid #262626; border-radius: 20px; padding: 35px 40px; width: 100%; max-width: 440px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .input-group { margin-bottom: 20px; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 15px; color: #666; font-size: 15px; }
        .toggle-icon { position: absolute; right: 15px; color: #666; font-size: 15px; cursor: pointer; }
        .toggle-icon:hover { color: #aaa; }
        input { width: 100%; background: #1a1a1a !important; border: 1px solid #333; border-radius: 12px; padding: 14px 45px; color: #fff !important; font-size: 15px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #d4af37; }
        label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: 500; }
        
        #passwordFeedbackContainer { display: none; margin-top: 10px; }
        .strength-bars { display: flex; gap: 6px; margin-bottom: 6px; }
        .bar { flex: 1; height: 4px; background: #2a2a2a; border-radius: 2px; transition: background 0.3s; }
        .strength-text { text-align: right; font-size: 12px; color: #777; font-weight: 600; margin-bottom: 12px; }
        .requirements-list { list-style: none; padding: 0; margin: 0; }
        .requirements-list li { font-size: 13px; color: #666; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; transition: color 0.3s; }
        .requirements-list li i { font-size: 11px; }
        .requirements-list li.valid { color: #4ade80; }
        .submit-btn { background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa8621 100%); color: #111; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.3s; margin-top: 5px; }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        #successMessage { display: none; background: #0d1813; border: 1px solid #153f29; border-radius: 16px; padding: 22px 24px; margin-bottom: 25px; box-sizing: border-box; }
        .success-content-wrapper { display: flex; align-items: flex-start; gap: 16px; }
        .success-icon-box { width: 44px; height: 44px; background: #112a1d; border: 1px solid #1e5c3b; border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; color: #00c087; font-size: 18px; }
        .success-text-group { display: flex; flex-direction: column; justify-content: center; }
        .success-title { color: #00c087; font-size: 18px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; }
        .success-desc { color: #53cca4; font-size: 14px; line-height: 1.4; margin: 0; }

        #responseMessage { margin-top: 15px; font-size: 13px; text-align: center; padding: 12px; border-radius: 10px; display: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="margin: 0 0 8px 0; font-size: 22px; text-align: center;">Reset Password</h2>
        <div style="text-align: center; color: #888; font-size: 14px; margin-bottom: 25px;">Create a new secure password</div>

        <!-- አረንጓዴው የ Success/Right Mark ቦክስ (መጀመሪያ ተደብቋል) -->
        <div id="successMessage">
            <div class="success-content-wrapper">
                <div class="success-icon-box">
                    <i class="fa-solid fa-check"></i>
                </div>
                <div class="success-text-group">
                    <div class="success-title">Password Reset Successful</div>
                    <p class="success-desc" id="successText">Your password has been successfully updated. Redirecting to login...</p>
                </div>
            </div>
        </div>

        <form id="resetForm">
            <div class="input-group">
                <label>New Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="new-password" placeholder="Enter new password" required>
                    <i class="fa-solid fa-eye-slash toggle-icon" id="toggleNewPass"></i>
                </div>
                
                <div id="passwordFeedbackContainer">
                    <div class="strength-bars" style="margin-top: 10px;">
                        <div class="bar" id="bar1"></div>
                        <div class="bar" id="bar2"></div>
                        <div class="bar" id="bar3"></div>
                        <div class="bar" id="bar4"></div>
                        <div class="bar" id="bar5"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Weak</div>

                    <ul class="requirements-list">
                        <li id="req-length"><i class="fa-solid fa-circle"></i> At least 8 characters</li>
                        <li id="req-upper"><i class="fa-solid fa-circle"></i> One uppercase letter (A–Z)</li>
                        <li id="req-lower"><i class="fa-solid fa-circle"></i> One lowercase letter (a–z)</li>
                        <li id="req-number"><i class="fa-solid fa-circle"></i> One number (0–9)</li>
                        <li id="req-special"><i class="fa-solid fa-circle"></i> One special character (!@#$...)</li>
                    </ul>
                </div>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="confirm-password" placeholder="Repeat your password" required>
                    <i class="fa-solid fa-eye-slash toggle-icon" id="toggleConfirmPass"></i>
                </div>
            </div>

            <button type="submit" id="resetSubmitBtn" class="submit-btn" disabled>Update Password</button>
        </form>

        <div id="responseMessage"></div>
    </div>

    <!-- 🔴 ከውጭ የሚጠራው ዋናው የጃቫስክሪፕት ፋይል 🔴 -->
    <script src="script.js"></script>
</body>
</html>
