<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard - TBR Exchange</title>
    <style>
        /* Modern Crypto Exchange Theme */
        :root {
            --bg-main: #0b0e11;
            --bg-card: #181a20;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --accent-color: #fcd535; /* Binance Yellow */
            --accent-hover: #f0c808;
            --danger-color: #f6465d;
            --danger-hover: #ff5e73;
            --border-color: #2b3139;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px 40px; 
            margin: 0; 
            font-size: 14px;
        }
        
        .container { max-width: 1200px; margin: auto; }
        
        /* Header Section */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        h1 { font-size: 22px; margin: 0; color: var(--text-primary); font-weight: 600; }
        h2 { font-size: 14px; margin: 0 0 15px 0; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Cards */
        .card { 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            padding: 24px; 
            margin-bottom: 24px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* Stats Grid */
        .stats-grid { display: flex; gap: 16px; flex-wrap: wrap; }
        .stat-box { 
            background-color: var(--bg-main); 
            padding: 16px 20px; 
            border-radius: 6px; 
            flex: 1; 
            min-width: 200px; 
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-label { color: var(--text-secondary); font-size: 12px; font-weight: 500; margin-bottom: 6px; }
        .stat-value { font-size: 22px; color: var(--text-primary); font-weight: 600; }
        .stat-value span { font-size: 14px; color: var(--text-secondary); font-weight: 400; margin-left: 4px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-secondary); font-weight: 500; text-transform: uppercase; font-size: 12px; border-bottom: 1px solid var(--border-color); }
        tr:hover td { background-color: rgba(255,255,255,0.02); }
        tr:last-child td { border-bottom: none; }
        
        .wallet-addr { color: var(--text-secondary); font-family: monospace; font-size: 13px; }
        .balance-val { color: var(--accent-color); font-weight: 600; }

        /* Buttons */
        button { 
            background-color: var(--accent-color); 
            color: #000; 
            border: none; 
            padding: 8px 16px; 
            cursor: pointer; 
            font-weight: 600; 
            border-radius: 4px; 
            font-size: 13px;
            transition: all 0.2s ease;
        }
        button:hover { background-color: var(--accent-hover); }
        
        .btn-logout { background-color: transparent; color: var(--danger-color); border: 1px solid var(--danger-color); }
        .btn-logout:hover { background-color: var(--danger-color); color: white; }
        
        .btn-sweep { padding: 6px 14px; font-size: 12px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Header -->
        <div class="header-container">
            <h1>Finance Dashboard</h1>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        
        <!-- Analytics Card -->
        <div class="card">
            <h2>System Analytics (ትርፍ እና እንቅስቃሴ)</h2>
            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">Total Volume</span>
                    <span class="stat-value" id="totalVolume">0.00 <span>USDT</span></span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Today Volume</span>
                    <span class="stat-value" id="todayVolume">0.00 <span>USDT</span></span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Total Profit (Fees)</span>
                    <span class="stat-value" id="totalProfit" style="color: var(--accent-color);">0.00 <span>USDT</span></span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Today Profit</span>
                    <span class="stat-value" id="todayProfit" style="color: var(--accent-color);">0.00 <span>USDT</span></span>
                </div>
            </div>
        </div>

        <!-- Pending Sweeps Card -->
        <div class="card">
            <h2>Pending Sweeps (ያልተጠረጉ ዶላሮች)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Wallet Address</th>
                        <th>Balance</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pendingTable">
                    <tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">Loading data...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const token = localStorage.getItem('token') || localStorage.getItem('adminToken');
        if (!token) {
            window.location.href = "/";
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/finance/stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('totalVolume').innerHTML = `${data.stats.totalVolume} <span>USDT</span>`;
                    document.getElementById('todayVolume').innerHTML = `${data.stats.todayVolume} <span>USDT</span>`;
                    document.getElementById('totalProfit').innerHTML = `${data.stats.totalProfit} <span>USDT</span>`;
                    document.getElementById('todayProfit').innerHTML = `${data.stats.todayProfit} <span>USDT</span>`;

                    const tbody = document.getElementById('pendingTable');
                    tbody.innerHTML = '';
                    if (data.pendingSweeps.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No pending sweeps at the moment.</td></tr>';
                    } else {
                        data.pendingSweeps.forEach(user => {
                            tbody.innerHTML += `
                                <tr>
                                    <td>${user.email}</td>
                                    <td class="wallet-addr">${user.bscAddress}</td>
                                    <td class="balance-val">${user.balance} USDT</td>
                                    <td><button class="btn-sweep" onclick="manualSweep('${user._id}')">Sweep to Master</button></td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch (error) {
                console.error("Fetch Error:", error);
            }
        }

        async function manualSweep(userId) {
            if(!confirm("Are you sure you want to sweep this balance to the Master Wallet?")) return;
            try {
                const res = await fetch('/api/admin/manual-sweep', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ userId })
                });
                const data = await res.json();
                alert(data.message);
                if(data.success) fetchStats(); 
            } catch (error) {
                alert('Sweep request failed.');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('adminToken');
            window.location.href = "/";
        }

        fetchStats();
    </script>
</body>
</html>
