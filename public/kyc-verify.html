<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification - TBR Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0e11;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #eaecef;
            padding-top: 75px;
            padding-bottom: 70px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #181a20;
            border-bottom: 1px solid #23272f;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo-container img {
            height: 32px;
            width: auto;
            object-fit: contain;
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-links a {
            color: #848e9c;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: #f0b90b;
            background: rgba(240, 185, 11, 0.08);
            border: 1px solid rgba(240, 185, 11, 0.2);
        }

        .container {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .status-badge {
            background: #181a20;
            border: 1px solid #23272f;
            color: #eaecef;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .steps-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
            position: relative;
            padding: 0 40px;
        }
        .steps-container::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 60px;
            right: 60px;
            height: 2px;
            background: #23272f;
            z-index: 1;
        }
        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .step-circle {
            width: 40px;
            height: 40px;
            background: #181a20;
            border: 2px solid #23272f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #848e9c;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .step-item.active .step-circle {
            border-color: #f0b90b;
            color: #f0b90b;
            background: rgba(240, 185, 11, 0.1);
        }
        .step-label {
            font-size: 11px;
            color: #848e9c;
            text-transform: uppercase;
            font-weight: bold;
        }
        .step-item.active .step-label {
            color: #f0b90b;
        }

        .top-banner-box {
            background: #181a20;
            border: 1px solid rgba(240, 185, 11, 0.3);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .banner-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }
        .banner-icon {
            width: 40px;
            height: 40px;
            background: rgba(240, 185, 11, 0.1);
            border: 1px solid rgba(240, 185, 11, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f0b90b;
            font-size: 16px;
            flex-shrink: 0;
        }
        .banner-text h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #ffffff;
        }
        .banner-text p {
            margin: 0;
            font-size: 13px;
            color: #848e9c;
        }

        .limits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .limit-card {
            background: #0b0e11;
            border: 1px solid #23272f;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .limit-card .label {
            font-size: 11px;
            color: #848e9c;
            margin-bottom: 6px;
        }
        .limit-card .sub-val {
            font-size: 12px;
            color: #555;
            text-decoration: line-through;
            margin-bottom: 2px;
        }
        .limit-card .val {
            font-size: 14px;
            font-weight: bold;
            color: #f0b90b;
        }

        .verify-main-btn {
            background: #f0b90b;
            color: #0b0e11;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .verify-main-btn:hover { opacity: 0.9; }
        .verify-main-btn:disabled { background: #555; cursor: not-allowed; }

        .form-card {
            background: #181a20;
            border: 1px solid #23272f;
            border-radius: 16px;
            padding: 30px;
        }
        .section-title {
            font-size: 13px;
            color: #848e9c;
            margin-bottom: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-control, select {
            width: 100%;
            background: #0b0e11;
            border: 1px solid #23272f;
            border-radius: 10px;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .form-control:focus, select:focus { border-color: #f0b90b; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .upload-box {
            background: #0b0e11;
            border: 2px dashed #23272f;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .upload-box:hover { border-color: #f0b90b; }
        .upload-box i { font-size: 22px; color: #848e9c; margin-bottom: 8px; }
        .upload-box span { display: block; font-size: 13px; color: #848e9c; }

        #cameraContainer {
            display: none;
            position: relative;
            background: #0b0e11;
            border: 2px solid #f0b90b;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
        }
        #videoElement {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
        }
        .camera-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .cam-btn {
            background: #f0b90b; color: #0b0e11; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .cam-btn-cancel {
            background: #23272f; color: #eaecef; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        #selfiePreviewContainer {
            display: none;
            margin-bottom: 20px;
            text-align: center;
            background: #0b0e11;
            border: 1px solid #23272f;
            padding: 15px;
            border-radius: 12px;
        }
        #selfiePreviewImg {
            max-width: 200px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #0ecb81;
        }
        .footer-note {
            display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #848e9c; margin-top: 15px; margin-bottom: 20px;
        }
        .footer-note a { color: #f0b90b; text-decoration: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <img src="logo.png" alt="TBR Exchange Logo">
            </div>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page-title">
            Verification
            <div class="status-badge" id="pageStatusBadge"><i class="fa-solid fa-circle" style="font-size: 8px; color: #f0b90b;"></i> Basic</div>
        </div>

        <div class="form-card" id="kycFormSection">
            <div class="form-group">
                <div class="section-title" style="margin-bottom: 6px;">Email Address *</div>
                <input type="email" id="emailInput" class="form-control" placeholder="Enter your registered email">
            </div>

            <div class="section-title">Document type</div>
            <div class="form-group">
                <select id="docTypeInput">
                    <option value="national_id">National ID</option>
                    <option value="passport">Passport</option>
                    <option value="driver_license">Driver's License</option>
                </select>
            </div>

            <div class="upload-grid">
                <div class="upload-box" id="frontBox" onclick="document.getElementById('frontInput').click()">
                    <i class="fa-solid fa-id-card" id="frontIcon"></i>
                    <span id="frontText">Front side *</span>
                </div>
                <input type="file" id="frontInput" style="display: none;" accept="image/*" onchange="handleFrontIdUpload(event)">

                <div class="upload-box" id="backBox" onclick="document.getElementById('backInput').click()">
                    <i class="fa-solid fa-id-card" id="backIcon"></i>
                    <span id="backText">Back side</span>
                </div>
                <input type="file" id="backInput" style="display: none;" accept="image/*" onchange="handleBackIdUpload(event)">
            </div>

            <div class="section-title">Selfie with ID *</div>
            <div class="upload-box" id="selfieTriggerBox" style="margin-bottom: 20px;" onclick="startCamera()">
                <i class="fa-solid fa-camera"></i>
                <span id="selfieStatusText">Hold ID next to your face</span>
            </div>

            <div id="cameraContainer">
                <video id="videoElement" autoplay playsinline></video>
                <div class="camera-actions">
                    <button type="button" class="cam-btn" onclick="captureSelfie()"><i class="fa-solid fa-camera"></i> Capture Photo</button>
                    <button type="button" class="cam-btn-cancel" onclick="stopCamera()">Cancel</button>
                </div>
            </div>

            <div id="selfiePreviewContainer">
                <img id="selfiePreviewImg" src="" alt="Selfie Preview">
                <div>
                    <button type="button" class="cam-btn-cancel" onclick="retakeSelfie()"><i class="fa-solid fa-rotate-left"></i> Retake Selfie</button>
                </div>
            </div>

            <canvas id="canvasElement" style="display: none;"></canvas>

            <div class="form-group">
                <div class="section-title" style="margin-bottom: 6px;">Full Name *</div>
                <input type="text" id="fullNameInput" class="form-control" placeholder="Enter your full name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <div class="section-title" style="margin-bottom: 6px;">ID Number</div>
                    <input type="text" id="idNumberInput" class="form-control" placeholder="ID Number">
                </div>
                <div class="form-group">
                    <div class="section-title" style="margin-bottom: 6px;">Date of Birth</div>
                    <input type="date" id="dobInput" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <div class="section-title" style="margin-bottom: 6px;">Residential Address</div>
                <input type="text" id="addressInput" class="form-control" placeholder="Address">
            </div>

            <button type="button" id="submitReviewBtn" class="verify-main-btn"><i class="fa-solid fa-arrow-up-from-bracket"></i> Submit for Review</button>
        </div>
    </div>

    <script>
    let videoStream = null;
    const videoElement = document.getElementById('videoElement');
    const cameraContainer = document.getElementById('cameraContainer');
    const selfieTriggerBox = document.getElementById('selfieTriggerBox');
    const selfiePreviewContainer = document.getElementById('selfiePreviewContainer');
    const selfiePreviewImg = document.getElementById('selfiePreviewImg');
    const canvasElement = document.getElementById('canvasElement');

    let frontImageBase64 = null;
    let backImageBase64 = null;
    let selfieImageBase64 = null;

    function convertFileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    window.addEventListener('DOMContentLoaded', async () => {
        // Auto fill email if stored
        const savedEmail = localStorage.getItem('userEmail') || localStorage.getItem('email') || '';
        if (document.getElementById('emailInput')) {
            document.getElementById('emailInput').value = savedEmail;
        }

        const token = localStorage.getItem('token') || localStorage.getItem('authToken') || localStorage.getItem('jwt');
        if (token) {
            try {
                const res = await fetch('https://tbr-exchange-backend.onrender.com/api/user/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success && data.user) {
                    if (data.user.email && document.getElementById('emailInput')) {
                        document.getElementById('emailInput').value = data.user.email;
                    }
                    if (data.user.fullName && document.getElementById('fullNameInput')) {
                        document.getElementById('fullNameInput').value = data.user.fullName;
                    }
                }
            } catch (e) {
                console.error('Profile fetch error', e);
            }
        }
    });

    async function startCamera() {
        try {
            if (cameraContainer) cameraContainer.style.display = 'block';
            if (selfieTriggerBox) selfieTriggerBox.style.display = 'none';
            if (selfiePreviewContainer) selfiePreviewContainer.style.display = 'none';
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
            if (videoElement) videoElement.srcObject = videoStream;
        } catch (err) {
            alert("Camera access error!");
            stopCamera();
        }
    }

    function stopCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        if (cameraContainer) cameraContainer.style.display = 'none';
    }

    function captureSelfie() {
        if (!videoElement) return;
        const context = canvasElement.getContext('2d');
        canvasElement.width = videoElement.videoWidth || 640;
        canvasElement.height = videoElement.videoHeight || 480;
        context.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
        selfieImageBase64 = canvasElement.toDataURL('image/jpeg');
        if (selfiePreviewImg) selfiePreviewImg.src = selfieImageBase64;
        if (selfiePreviewContainer) selfiePreviewContainer.style.display = 'block';
        stopCamera();
    }

    function retakeSelfie() {
        selfieImageBase64 = null;
        if (selfiePreviewContainer) selfiePreviewContainer.style.display = 'none';
        startCamera();
    }

    async function handleFrontIdUpload(event) {
        const file = event.target.files[0];
        if (file) {
            frontImageBase64 = await convertFileToBase64(file);
            document.getElementById('frontText').innerHTML = '<span style="color: #0ecb81;">Front Uploaded ✓</span>';
        }
    }

    async function handleBackIdUpload(event) {
        const file = event.target.files[0];
        if (file) {
            backImageBase64 = await convertFileToBase64(file);
            document.getElementById('backText').innerHTML = '<span style="color: #0ecb81;">Back Uploaded ✓</span>';
        }
    }

    document.getElementById('submitReviewBtn')?.addEventListener('click', async () => {
        const email = document.getElementById('emailInput')?.value.trim() || '';
        const fullName = document.getElementById('fullNameInput')?.value.trim() || '';
        const idNumber = document.getElementById('idNumberInput')?.value.trim() || '';
        const dob = document.getElementById('dobInput')?.value || '';
        const address = document.getElementById('addressInput')?.value.trim() || '';
        const docType = document.getElementById('docTypeInput')?.value || '';

        if (!email) {
            alert('እባክዎ ኢሜልዎን (Email) ያስገቡ!');
            document.getElementById('emailInput')?.focus();
            return;
        }
        if (!fullName) {
            alert('እባክዎ ሙሉ ስምዎን ያስገቡ!');
            return;
        }
        if (!frontImageBase64 || !selfieImageBase64) {
            alert('እባክዎ የ ID ፊት እና የሰልፊ ፎቶ ያስገቡ!');
            return;
        }

        const submitBtn = document.getElementById('submitReviewBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

        const token = localStorage.getItem('token') || localStorage.getItem('authToken') || localStorage.getItem('jwt');

        try {
            const response = await fetch('https://tbr-exchange-backend.onrender.com/api/kyc/submit', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                },
                body: JSON.stringify({ 
                    email,
                    fullName, 
                    idNumber, 
                    dateOfBirth: dob, 
                    residentialAddress: address, 
                    docType,
                    frontImage: frontImageBase64,
                    backImage: backImageBase64 || '',
                    selfieImage: selfieImageBase64
                })
            });

            const result = await response.json();
            if (response.ok && result.success) {
                alert('KYC successfully submitted for review!');
                window.location.href = 'dashboard.html';
            } else {
                alert(result.message || 'Error submitting KYC.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-up-from-bracket"></i> Submit for Review';
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Network or server error.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-arrow-up-from-bracket"></i> Submit for Review';
        }
    });
    </script>
</body>
</html>
