<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYC Verification - TBR Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #080808;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            padding-top: 75px;
            padding-bottom: 70px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #121212;
            border-bottom: 1px solid #262626;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo-container img {
            height: 32px;
            width: auto;
            object-fit: contain;
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .kyc-card {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 18px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
        }

        .form-control, select {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 15px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .form-control:focus, select:focus {
            border-color: #d4af37;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .upload-box {
            background: #1a1a1a;
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #d4af37;
        }

        .upload-box i {
            font-size: 24px;
            color: #888;
            margin-bottom: 8px;
        }

        .upload-box span {
            display: block;
            font-size: 12px;
            color: #888;
        }

        .submit-btn {
            background: #0ecb81;
            color: #000;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        @media(max-width: 768px) {
            .form-row, .upload-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <img src="logo.png" alt="TBR Exchange Logo">
            </div>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="kyc-card">
            <h2 style="margin-top: 0; margin-bottom: 25px; font-size: 20px; color: #fff;">Identity Verification</h2>
            
            <!-- 1.ጀመሪያ Selfie with ID እንዲሆን ተደርጓል -->
            <div class="form-group">
                <label>Selfie with ID</label>
                <div class="upload-box" onclick="document.getElementById('selfieInput').click()">
                    <i class="fa-solid fa-camera"></i>
                    <span>Upload Selfie holding ID</span>
                </div>
                <input type="file" id="selfieInput" style="display: none;" accept="image/*">
            </div>

            <!-- 2. ከዚያ ቀጥሎ በቀይ ያከበብካቸው Document Type, ID Number እና የመሳሰሉት ተካተዋል -->
            <div class="form-group">
                <label>Document Type</label>
                <select>
                    <option value="national_id">National ID</option>
                    <option value="passport">Passport</option>
                    <option value="driver_license">Driver's License</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ID Number</label>
                    <input type="text" class="form-control" placeholder="e.g. 123456">
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" class="form-control">
                </div>
            </div>

            <div class="upload-grid">
                <div class="upload-box" onclick="document.getElementById('frontInput').click()">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Front Side</span>
                </div>
                <input type="file" id="frontInput" style="display: none;" accept="image/*">

                <div class="upload-box" onclick="document.getElementById('backInput').click()">
                    <i class="fa-solid fa-id-card"></i>
                    <span>Back Side</span>
                </div>
                <input type="file" id="backInput" style="display: none;" accept="image/*">
            </div>

            <button class="submit-btn"><i class="fa-solid fa-shield-halved"></i> Submit for AI Verification</button>
        </div>
    </div>

</body>
</html>
