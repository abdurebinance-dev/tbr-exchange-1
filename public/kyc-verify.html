<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification - TBR Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #080808;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            padding-top: 75px;
            padding-bottom: 70px;
        }
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: #121212;
            border-bottom: 1px solid #262626;
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; box-sizing: border-box;
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo-container img { height: 32px; width: auto; object-fit: contain; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a {
            color: #888; text-decoration: none; font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: #d4af37; background: rgba(212, 175, 55, 0.08); border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        
        .steps-container {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; position: relative; padding: 0 30px;
        }
        .step-item { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2; }
        .step-circle {
            width: 34px; height: 34px; border-radius: 50%;
            background: #121212; border: 2px solid #333;
            display: flex; align-items: center; justify-content: center; color: #777; font-size: 13px;
        }
        .step-item.active .step-circle { border-color: #d4af37; color: #d4af37; background: rgba(212, 175, 55, 0.1); }
        .step-label { font-size: 11px; color: #777; text-transform: uppercase; font-weight: bold; }
        .step-item.active .step-label { color: #d4af37; }
        .step-line { position: absolute; top: 17px; left: 80px; right: 80px; height: 2px; background: #222; z-index: 1; }

        .limits-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            margin-bottom: 20px; background: #181818; padding: 15px; border-radius: 12px; border: 1px solid #222;
        }
        .limit-item { text-align: center; }
        .limit-item .label { font-size: 11px; color: #777; margin-bottom: 4px; }
        .limit-item .val { font-size: 13px; font-weight: bold; color: #d4af37; }
        .limit-item .old-val { text-decoration: line-through; color: #777; margin-right: 4px; font-size: 11px; }

        .kyc-card {
            background: #121212; border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 18px; padding: 30px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 8px; }
        .select-box, .input-box {
            width: 100%; background: #181818; border: 1px solid #262626; border-radius: 10px;
            padding: 12px 16px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .upload-box, .upload-box-full {
            background: #181818; border: 1px dashed #333; border-radius: 12px;
            padding: 25px 20px; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .upload-box:hover, .upload-box-full:hover { border-color: #d4af37; background: #1a1a1a; }
        .upload-box-full { margin-bottom: 20px; }
        .submit-btn {
            width: 100%; background: #10b981; color: #fff; border: none; border-radius: 12px;
            padding: 14px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .submit-btn:hover { background: #059669; }
        .preview-text { font-size: 11px; color: #10b981; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <div class="logo-container"><img src="logo.png" alt="Logo"></div>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="steps-container">
            <div class="step-line"></div>
            <div class="step-item active"><div class="step-circle"><i class="fa-solid fa-check"></i></div><div class="step-label">Basic</div></div>
            <div class="step-item active"><div class="step-circle"><i class="fa-solid fa-shield-halved"></i></div><div class="step-label">Verified</div></div>
            <div class="step-item"><div class="step-circle"><i class="fa-solid fa-star"></i></div><div class="step-label">Merchant</div></div>
        </div>

        <div class="kyc-card">
            <div class="limits-grid">
                <div class="limit-item"><div class="label">Daily trade</div><div class="val"><span class="old-val">1K</span> 10K USDT</div></div>
                <div class="limit-item"><div class="label">Withdrawal</div><div class="val"><span class="old-val">1K</span> 10K USDT</div></div>
                <div class="limit-item"><div class="label">Post ads</div><div class="val" style="color: #22c55e;">Unlocked</div></div>
            </div>

            <div class="form-group">
                <label>Document type</label>
                <select class="select-box" id="docType">
                    <option value="National ID">National ID</option>
                    <option value="Passport">Passport</option>
                    <option value="Driver's License">Driver's License</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group"><label>ID Number</label><input type="text" class="input-box" id="idNumber" placeholder="e.g. 123456"></div>
                <div class="form-group"><label>Date of Birth</label><input type="text" class="input-box" id="dob" placeholder="dd/mm/yyyy"></div>
            </div>

            <div class="upload-grid">
                <div class="upload-box" onclick="document.getElementById('frontFile').click()">
                    <i class="fa-solid fa-id-card" style="color:#888; font-size:18px;"></i>
                    <div style="font-size:12px; color:#aaa; margin-top:8px;">Front side</div>
                    <div id="frontStatus" class="preview-text"></div>
                    <input type="file" id="frontFile" accept="image/*" style="display:none;" onchange="handleFileSelect(this, 'frontStatus')">
                </div>
                <div class="upload-box" onclick="document.getElementById('backFile').click()">
                    <i class="fa-solid fa-file-lines" style="color:#888; font-size:18px;"></i>
                    <div style="font-size:12px; color:#aaa; margin-top:8px;">Back side</div>
                    <div id="backStatus" class="preview-text"></div>
                    <input type="file" id="backFile" accept="image/*" style="display:none;" onchange="handleFileSelect(this, 'backStatus')">
                </div>
            </div>

            <div class="upload-box-full" onclick="document.getElementById('selfieFile').click()">
                <i class="fa-solid fa-camera" style="color:#888; font-size:18px;"></i>
                <div style="font-size:12px; color:#aaa; margin-top:8px;">Selfie with ID</div>
                <div id="selfieStatus" class="preview-text"></div>
                <input type="file" id="selfieFile" accept="image/*" style="display:none;" onchange="handleFileSelect(this, 'selfieStatus')">
            </div>

            <button class="submit-btn"><i class="fa-solid fa-paper-plane"></i> Submit for AI Verification</button>
        </div>
    </div>

    <script>
        let uploadedFiles = { front: '', back: '', selfie: '' };

        function handleFileSelect(input, statusId) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (statusId === 'frontStatus') uploadedFiles.front = e.target.result;
                    if (statusId === 'backStatus') uploadedFiles.back = e.target.result;
                    if (statusId === 'selfieStatus') uploadedFiles.selfie = e.target.result;
                    
                    document.getElementById(statusId).innerText = '✓ ' + file.name;
                };
                reader.readAsDataURL(file);
            }
        }

        document.querySelector('.submit-btn').addEventListener('click', async function(e) {
            e.preventDefault();
            
            const idNumber = document.getElementById('idNumber').value;
            if (!idNumber) {
                alert('Please enter your ID number.');
                return;
            }

            if (!uploadedFiles.front || !uploadedFiles.selfie) {
                alert('Please upload both Front ID and Selfie images.');
                return;
            }

            this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing AI Verification...';
            this.disabled = true;

            try {
                const response = await fetch('/api/kyc/verify-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: 'TBR-' + Math.floor(1000 + Math.random() * 9000),
                        documentType: document.getElementById('docType').value,
                        idNumber: idNumber,
                        dob: document.getElementById('dob').value,
                        frontImage: uploadedFiles.front,
                        backImage: uploadedFiles.back,
                        selfieImage: uploadedFiles.selfie
                    })
                });

                const data = await response.json();
                
                if (data.success && data.status === 'Verified') {
                    alert('🎉 ' + data.message);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('⚠️ ' + (data.message || 'Documents submitted for manual review.'));
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error('Error:', err);
                alert('Connection error occurred during verification.');
                this.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit for AI Verification';
                this.disabled = false;
            }
        });
    </script>
</body>
</html>
