<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification - TBR Exchange</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
    <link rel="shortcut icon" type="image/png" href="/icon-192.png?v=3">
    <link rel="apple-touch-icon" href="/icon-192.png?v=3">
    <link rel="manifest" href="/manifest.json?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #eaecef; padding-top: 75px; padding-bottom: 70px; }
        .navbar { position: fixed; top: 0; left: 0; width: 100%; background: #181a20; border-bottom: 1px solid #23272f; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-sizing: border-box; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .logo-container img { height: 32px; width: auto; object-fit: contain; display: block; }
        .nav-links { display: flex; gap: 15px; }
        .nav-links a { color: #848e9c; text-decoration: none; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; transition: 0.2s; }
        .nav-links a.active, .nav-links a:hover { color: #f0b90b; background: rgba(240, 185, 11, 0.08); border: 1px solid rgba(240, 185, 11, 0.2); }
        .container { max-width: 850px; margin: 30px auto; padding: 0 20px; }
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; color: #ffffff; }
        .status-badge { background: #181a20; border: 1px solid #23272f; color: #eaecef; padding: 6px 14px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .form-card { background: #181a20; border: 1px solid #23272f; border-radius: 16px; padding: 30px; }
        .section-title { font-size: 13px; color: #848e9c; margin-bottom: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-control, select { width: 100%; background: #0b0e11; border: 1px solid #23272f; border-radius: 10px; padding: 12px 15px; color: #fff; font-size: 14px; box-sizing: border-box; outline: none; }
        .form-control:focus, select:focus { border-color: #f0b90b; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .upload-box { background: #0b0e11; border: 2px dashed #23272f; border-radius: 12px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .upload-box:hover { border-color: #f0b90b; }
        .upload-box i { font-size: 22px; color: #848e9c; margin-bottom: 8px; }
        .upload-box span { display: block; font-size: 13px; color: #848e9c; }
        #cameraContainer { display: none; position: relative; background: #0b0e11; border: 2px solid #f0b90b; border-radius: 12px; overflow: hidden; text-align: center; margin-bottom: 20px; padding: 10px; }
        #videoElement { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; }
        .camera-actions { margin-top: 10px; display: flex; gap: 10px; justify-content: center; }
        .cam-btn { background: #f0b90b; color: #0b0e11; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .cam-btn-cancel { background: #23272f; color: #eaecef; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #selfiePreviewContainer { display: none; margin-bottom: 20px; text-align: center; background: #0b0e11; border: 1px solid #23272f; padding: 15px; border-radius: 12px; }
        #selfiePreviewImg { max-width: 200px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #0ecb81; }
        .verify-main-btn { background: #f0b90b; color: #0b0e11; width: 100%; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .verify-main-btn:hover { opacity: 0.9; }
        .verify-main-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <img src="logo.png" alt="TBR Exchange Logo">
            </div>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page-title">
            Verification
            <div class="status-badge" id="pageStatusBadge">
                <i class="fa-solid fa-circle" id="statusDot" style="font-size: 8px; color: #f0b90b;"></i> 
                <span id="statusText">Unverified</span>
            </div>
        </div>

        <div class="form-card" id="kycFormSection">
            <div class="form-group">
                <div class="section-title" style="margin-bottom: 6px;">Email Address *</div>
                <input type="email" id="emailInput" class="form-control" placeholder="Enter your registered email">
            </div>

            <div class="section-title">Document type</div>
            <div class="form-group">
                <select id="docTypeInput">
                    <option value="national_id">National ID</option>
                    <option value="passport">Passport</option>
                    <option value="driver_license">Driver's License</option>
                </select>
            </div>

            <div class="upload-grid">
                <div class="upload-box" id="frontBox">
                    <i class="fa-solid fa-id-card" id="frontIcon"></i>
                    <span id="frontText">Front side *</span>
                </div>
                <input type="file" id="frontInput" style="display: none;" accept="image/*">

                <div class="upload-box" id="backBox">
                    <i class="fa-solid fa-id-card" id="backIcon"></i>
                    <span id="backText">Back side</span>
                </div>
                <input type="file" id="backInput" style="display: none;" accept="image/*">
            </div>

            <div class="section-title">Selfie with ID *</div>
            <div class="upload-box" id="selfieTriggerBox" style="margin-bottom: 20px;">
                <i class="fa-solid fa-camera"></i>
                <span id="selfieStatusText">Hold ID next to your face</span>
            </div>

            <div id="cameraContainer">
                <video id="videoElement" autoplay playsinline></video>
                <div class="camera-actions">
                    <button type="button" class="cam-btn" id="captureBtn"><i class="fa-solid fa-camera"></i> Capture Photo</button>
                    <button type="button" class="cam-btn-cancel" id="cancelCamBtn">Cancel</button>
                </div>
            </div>

            <div id="selfiePreviewContainer">
                <img id="selfiePreviewImg" alt="Selfie Preview">
                <div>
                    <button type="button" class="cam-btn-cancel" id="retakeBtn"><i class="fa-solid fa-rotate-left"></i> Retake Selfie</button>
                </div>
            </div>

            <canvas id="canvasElement" style="display: none;"></canvas>

            <div class="form-group">
                <div class="section-title" style="margin-bottom: 6px;">Full Name *</div>
                <input type="text" id="fullNameInput" class="form-control" placeholder="Enter your full name">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <div class="section-title" style="margin-bottom: 6px;">ID Number</div>
                    <input type="text" id="idNumberInput" class="form-control" placeholder="ID Number">
                </div>
                <div class="form-group">
                    <div class="section-title" style="margin-bottom: 6px;">Date of Birth</div>
                    <input type="date" id="dobInput" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <div class="section-title" style="margin-bottom: 6px;">Residential Address</div>
                <input type="text" id="addressInput" class="form-control" placeholder="Address">
            </div>

            <button type="button" id="submitReviewBtn" class="verify-main-btn"><i class="fa-solid fa-arrow-up-from-bracket"></i> Submit for Review</button>
        </div>
    </div>

    <!-- 🔴 Ituturo nito sa bagong JS file -->
    <script src="kyc.js?v=1"></script>
</body>
</html>
