<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - Buy & Sell USDT | Peer-to-Peer Crypto Exchange</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
    <link rel="shortcut icon" type="image/png" href="/icon-192.png?v=3">
    <link rel="apple-touch-icon" href="/icon-192.png?v=3">
    <link rel="manifest" href="/manifest.json?v=3">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #080808; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }
        .form-container { background: #121212; border: 1px solid #262626; border-radius: 20px; padding: 40px; width: 100%; max-width: 440px; box-sizing: border-box; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        .passkey-btn { background: #1a1a1a; color: #fff; width: 100%; padding: 14px; border: 1px solid #333; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; }
        .passkey-btn:hover { background: #252525; border-color: #444; }
        .divider { display: flex; align-items: center; text-align: center; color: #666; font-size: 12px; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #262626; }
        .divider span { padding: 0 10px; }
        .input-box { position: relative; display: flex; align-items: center; margin-bottom: 15px; }
        .input-icon { position: absolute; left: 15px; color: #666; font-size: 15px; z-index: 2; }
        .form-container input[type="text"], .form-container input[type="password"], .form-container input[type="email"] { width: 100%; background: #1a1a1a !important; border: 1px solid #333; border-radius: 12px; padding: 14px 45px; color: #fff !important; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.2s; }
        .form-container input:focus { border-color: #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .form-container input:disabled { opacity: 0.5; cursor: not-allowed; }
        .form-container label { display: block; font-size: 13px; color: #aaa; margin-bottom: 8px; font-weight: 500; }
        .forgot-container { text-align: right; margin-bottom: 20px; }
        .forgot-container a { color: #d4af37; font-size: 13px; text-decoration: none; }
        .captcha-box { background: #181818; border: 1px solid #333; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .captcha-left { display: flex; align-items: center; gap: 12px; }
        .captcha-icon { width: 26px; height: 26px; background: #00c087; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .cloudflare-text { font-size: 11px; font-weight: bold; color: #f48120; letter-spacing: 0.5px; display: block; }
        .submit-btn { background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa8621 100%); color: #111; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .submit-btn:hover:not(:disabled) { opacity: 0.95; }
        .signin-text { text-align: center; margin-top: 25px; font-size: 14px; color: #888; }
        .signin-text a { color: #d4af37; text-decoration: none; font-weight: 600; }
        #responseMessage { display: none; background: #180d0d; border: 1px solid #3f1515; border-radius: 16px; padding: 22px 24px; margin-bottom: 25px; box-sizing: border-box; }
        .error-content-wrapper { display: flex; align-items: flex-start; gap: 16px; }
        .error-icon-box { width: 44px; height: 44px; background: #2a1111; border: 1px solid #5a1d1d; border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; color: #ff5c5c; font-size: 18px; }
        .error-text-group { display: flex; flex-direction: column; justify-content: center; }
        .error-title { color: #ff5c5c; font-size: 18px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; }
        .error-desc { color: #e06c6c; font-size: 14px; line-height: 1.4; margin: 0; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="logo-header" style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
            <img src="logo.png" alt="TBR Exchange Logo" style="height: 38px; object-fit: contain;">
        </div>
        
        <h2 style="margin: 0 0 5px 0; font-size: 22px; text-align: center;">Welcome back</h2>
        <div class="subtitle" style="text-align: center; color: #888; font-size: 14px; margin-bottom: 25px;">Sign in to your TBR account</div>

        <div id="googleSignInBtnContainer" style="display: flex; justify-content: center; width: 100%; margin-bottom: 10px;"></div>

        <button type="button" class="passkey-btn" id="passkeyBtn" style="margin-bottom: 15px;">
            <i class="fa-solid fa-key" style="color: #d4af37;"></i> Sign in with Passkey
        </button>

        <div id="responseMessage">
            <div class="error-content-wrapper">
                <div class="error-icon-box">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="error-text-group">
                    <div class="error-title" id="errorTitle">Access Locked</div>
                    <p class="error-desc" id="errorText">Too many failed attempts. Try again in 25m 00s.</p>
                </div>
            </div>
        </div>

        <div class="divider"><span>OR</span></div>

        <form id="signinForm">
            <label>Email or Phone</label>
            <div class="input-box">
                <i class="fa-regular fa-user input-icon"></i>
                <input type="text" name="email" id="signin-email" placeholder="Enter email or phone" required>
            </div>

            <label>Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" id="signin-pass" placeholder="Enter password" required>
                <!-- 🔴 እዚህ ጋር የነበረው 'onclick' ጠፍቶ በ id ተቀይሯል 🔴 -->
                <i id="togglePasswordIcon" class="fa-regular fa-eye toggle-password" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #777; cursor: pointer;"></i>
            </div>

            <div class="forgot-container">
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <div class="captcha-box">
                <div class="captcha-left">
                    <div class="captcha-icon"><i class="fa-solid fa-check" style="color: #111;"></i></div>
                    <span style="color: #fff; font-weight: 500; font-size: 13px;">Success!</span>
                </div>
                <div class="captcha-right" style="text-align: right;">
                    <span class="cloudflare-text">CLOUDFLARE</span>
                    <a href="#" style="color: #888; text-decoration: none; font-size: 10px;">Privacy › Fidir</a>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Sign In →</button>
        </form>

        <div class="signin-text">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <!-- 🔴 ከታች የነበረው ረጅም ጃቫስክሪፕት በሙሉ ወጥቶ በዚህ ሊንክ ተተክቷል 🔴 -->
    <script src="script.js"></script>
</body>
</html>
