<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - Buy & Sell USDT | Peer-to-Peer Crypto Exchange</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #080808;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
        }
        .form-container {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        /* የተስተካከለው የሎጎ ስታይል */
        .logo {
            font-size: 20px;
            font-weight: 900;
            color: #111;
            background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa8621 100%);
            padding: 6px 14px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            letter-spacing: 1px;
        }
        .passkey-btn {
            background: #1a1a1a;
            color: #fff;
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .passkey-btn:hover {
            background: #252525;
            border-color: #444;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #262626;
        }
        .divider span {
            padding: 0 10px;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .input-icon {
            position: absolute;
            left: 15px;
            color: #666;
            font-size: 15px;
            z-index: 2;
        }
        .form-container input[type="text"], 
        .form-container input[type="password"],
        .form-container input[type="email"] {
            width: 100%;
            background: #1a1a1a !important;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px 45px;
            color: #fff !important;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }
        .form-container input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .form-container input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .form-container label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .forgot-container {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-container a {
            color: #d4af37;
            font-size: 13px;
            text-decoration: none;
        }
        .captcha-box {
            background: #181818;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .captcha-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .captcha-icon {
            width: 26px;
            height: 26px;
            background: #00c087;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cloudflare-text {
            font-size: 11px;
            font-weight: bold;
            color: #f48120;
            letter-spacing: 0.5px;
            display: block;
        }
        .submit-btn {
            background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa8621 100%);
            color: #111;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .submit-btn:hover:not(:disabled) {
            opacity: 0.95;
        }
        .signin-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #888;
        }
        .signin-text a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 600;
        }
        #responseMessage {
            display: none;
            background: #180d0d;
            border: 1px solid #3f1515;
            border-radius: 16px;
            padding: 22px 24px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        .error-content-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }
        .error-icon-box {
            width: 44px;
            height: 44px;
            background: #2a1111;
            border: 1px solid #5a1d1d;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            color: #ff5c5c;
            font-size: 18px;
        }
        .error-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .error-title {
            color: #ff5c5c;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 8px;
        }
        .error-desc {
            color: #e06c6c;
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- ሎጎው በትክክል እንዲታይ ተደረገ -->
        <div class="logo-header" style="display: flex; justify-content: center; align-items: center; margin-bottom: 20px;">
    <img src="logo.png" alt="TBR Exchange Logo" style="height: 38px; object-fit: contain;">
</div>
        
        <h2 style="margin: 0 0 5px 0; font-size: 22px; text-align: center;">Welcome back</h2>
        <div class="subtitle" style="text-align: center; color: #888; font-size: 14px; margin-bottom: 25px;">Sign in to your TBR account</div>

        <div id="googleSignInBtnContainer" style="display: flex; justify-content: center; width: 100%; margin-bottom: 10px;"></div>

        <button type="button" class="passkey-btn" id="passkeyBtn" style="margin-bottom: 15px;">
            <i class="fa-solid fa-key" style="color: #d4af37;"></i> Sign in with Passkey
        </button>

        <div id="responseMessage">
            <div class="error-content-wrapper">
                <div class="error-icon-box">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div class="error-text-group">
                    <div class="error-title" id="errorTitle">Access Locked</div>
                    <p class="error-desc" id="errorText">Too many failed attempts. Try again in 25m 00s.</p>
                </div>
            </div>
        </div>

        <div class="divider"><span>OR</span></div>

        <form id="signinForm">
            <label>Email or Phone</label>
            <div class="input-box">
                <i class="fa-regular fa-user input-icon"></i>
                <input type="text" name="email" id="signin-email" placeholder="Enter email or phone" required>
            </div>

            <label>Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" id="signin-pass" placeholder="Enter password" required>
                <i class="fa-regular fa-eye toggle-password" onclick="togglePass('signin-pass', this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #777; cursor: pointer;"></i>
            </div>

            <div class="forgot-container">
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <div class="captcha-box">
                <div class="captcha-left">
                    <div class="captcha-icon"><i class="fa-solid fa-check" style="color: #111;"></i></div>
                    <span style="color: #fff; font-weight: 500; font-size: 13px;">Success!</span>
                </div>
                <div class="captcha-right" style="text-align: right;">
                    <span class="cloudflare-text">CLOUDFLARE</span>
                    <a href="#" style="color: #888; text-decoration: none; font-size: 10px;">Privacy › Fidir</a>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Sign In →</button>
        </form>

        <div class="signin-text">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname.includes('localhost') 
            ? '' 
            : 'https://tbr-exchange-backend.onrender.com';

        function togglePass(id, icon) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        window.onload = function () {
            if (typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.initialize({
                    client_id: "661544926174-8kp01crhke9m1vmjf6kcts5o2e7sqek8.apps.googleusercontent.com",
                    callback: handleGoogleResponse
                });

                google.accounts.id.renderButton(
                    document.getElementById("googleSignInBtnContainer"),
                    { 
                        theme: "filled_black", 
                        size: "large", 
                        width: "340",
                        shape: "rectangular",
                        text: "continue_with"
                    }
                );
            }

            const savedEmail = localStorage.getItem('signinEmail');
            if (savedEmail) {
                document.getElementById('signin-email').value = savedEmail;
                checkSignInRateLimit(savedEmail);
            }
        };

        document.getElementById('passkeyBtn').addEventListener('click', async () => {
            try {
                showError("Passkey", "Connecting to biometric / passkey device...");
                const response = await fetch(`${API_BASE_URL}/api/passkey-signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = data.redirectUrl || 'dashboard.html';
                } else {
                    showError("Passkey Failed", data.message || "Passkey sign-in failed.");
                }
            } catch (err) {
                console.error('Passkey error:', err);
                showError("Passkey Error", "Passkey authentication is not supported or cancelled.");
            }
        });

        document.getElementById('signin-email').addEventListener('input', function() {
            const identifier = this.value.trim();
            if (identifier) {
                checkSignInRateLimit(identifier);
            }
        });

        let countdownInterval = null;

        function checkSignInRateLimit(identifier) {
            const lockoutKey = 'tbr_signin_lockout_' + identifier;
            const lockoutUntil = localStorage.getItem(lockoutKey);
            
            if (lockoutUntil) {
                const lockoutTimeNum = Number(lockoutUntil);
                const remainingTime = lockoutTimeNum - new Date().getTime();
                if (!isNaN(remainingTime) && remainingTime > 0) {
                    startCountdownFromTarget(lockoutTimeNum);
                } else {
                    localStorage.removeItem(lockoutKey);
                    localStorage.removeItem('tbr_signin_attempts_' + identifier);
                    unlockSignInForm();
                }
            } else {
                unlockSignInForm();
            }
        }

        function startCountdown(durationMs) {
            const lockoutEnd = new Date().getTime() + Number(durationMs);
            localStorage.setItem('tbr_signin_lockout_' + document.getElementById('signin-email').value.trim(), lockoutEnd);
            startCountdownFromTarget(lockoutEnd);
        }

        function startCountdownFromTarget(lockoutEndTime) {
            const submitBtn = document.getElementById('submitBtn');
            const passInput = document.getElementById('signin-pass');

            passInput.disabled = true;
            submitBtn.disabled = true;

            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = Number(lockoutEndTime) - now;

                if (isNaN(distance) || distance <= 0) {
                    clearInterval(countdownInterval);
                    const identifier = document.getElementById('signin-email').value.trim();
                    if (identifier) {
                        localStorage.removeItem('tbr_signin_lockout_' + identifier);
                        localStorage.removeItem('tbr_signin_attempts_' + identifier);
                    }
                    unlockSignInForm();
                } else {
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    submitBtn.textContent = `Locked (${minutes}m ${seconds}s)`;
                    showError("Access Locked", `Too many failed attempts. Try again in ${minutes}m ${seconds}s.`);
                }
            }, 1000);
        }

        function unlockSignInForm() {
            if (countdownInterval) clearInterval(countdownInterval);
            const submitBtn = document.getElementById('submitBtn');
            const emailInput = document.getElementById('signin-email');
            const passInput = document.getElementById('signin-pass');

            emailInput.disabled = false;
            passInput.disabled = false;
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In →';
            hideError();
        }

        async function handleGoogleResponse(response) {
            try {
                const res = await fetch(`${API_BASE_URL}/api/google-auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });

                const data = await res.json();
                if (data.success) {
                    if (data.exists) {
                        window.location.href = data.redirectUrl || 'dashboard.html';
                    } else {
                        localStorage.setItem('signupEmail', data.email);
                        window.location.href = 'signup.html';
                    }
                } else {
                    showError("Authentication Failed", data.message || 'Google authentication failed.');
                }
            } catch (err) {
                console.error('Error:', err);
                showError("Server Error", 'Server error during Google sign-in.');
            }
        }

        function showError(title, message) {
            const msgBox = document.getElementById('responseMessage');
            const errorTitle = document.getElementById('errorTitle');
            const errorText = document.getElementById('errorText');
            
            errorTitle.textContent = title;
            errorText.textContent = message;
            msgBox.style.display = 'block';
        }

        function hideError() {
            const msgBox = document.getElementById('responseMessage');
            msgBox.style.display = 'none';
        }

        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('signin-email').value.trim();
            const password = document.getElementById('signin-pass').value;
            const submitBtn = document.getElementById('submitBtn');

            const attemptsKey = 'tbr_signin_attempts_' + identifier;
            let currentAttempts = parseInt(localStorage.getItem(attemptsKey) || '0', 10);
            currentAttempts++;
            localStorage.setItem(attemptsKey, currentAttempts);

            if (currentAttempts > 5) {
                const lockoutDurationMs = 25 * 60 * 1000;
                startCountdown(lockoutDurationMs);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';
            hideError();

            try {
                const response = await fetch(`${API_BASE_URL}/api/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.removeItem(attemptsKey); 
                    if (data.requiresVerification) {
                        localStorage.setItem('verifyEmail', data.email);
                        window.location.href = 'login-verify.html';
                    } else {
                        window.location.href = data.redirectUrl || 'dashboard.html';
                    }
                } else {
                    const errorMsg = data.message ? data.message.toLowerCase() : '';
                    
                    if (currentAttempts >= 5 || errorMsg.includes('too many') || response.status === 429) {
                        let lockoutDurationMs = 25 * 60 * 1000;
                        if (data.lockUntil) {
                            const serverLockTime = new Date(data.lockUntil).getTime();
                            if (!isNaN(serverLockTime)) {
                                lockoutDurationMs = Math.max(serverLockTime - new Date().getTime(), lockoutDurationMs);
                            }
                        }
                        startCountdown(lockoutDurationMs);
                    } else {
                        showError("Sign in failed", data.message || 'Incorrect email or password.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Sign In →';
                    }
                }
            } catch (err) {
                console.error('Error:', err);
                showError("Connection Error", 'Server connection error. Please try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In →';
            }
        });
    </script>
</body>
</html>
