<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #080808;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        .form-container {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .input-icon {
            position: absolute;
            left: 15px;
            color: #666;
            font-size: 15px;
        }
        input {
            width: 100%;
            background: #1a1a1a !important;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px 15px 14px 45px;
            color: #fff !important;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #d4af37;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            font-weight: 500;
            text-align: left;
        }
        .submit-btn {
            background: linear-gradient(135deg, #f5d77f 0%, #d4af37 50%, #aa8621 100%);
            color: #111;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* የ Success ንድፍ (እንደ ስክሪን ሾቱ) */
        #successState {
            display: none;
        }
        .success-icon-container {
            width: 80px;
            height: 80px;
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid rgba(34, 197, 94, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
        }
        .success-icon-container i {
            font-size: 36px;
            color: #22c55e;
        }
        .email-pill {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            font-size: 15px;
            color: #fff;
        }
        .email-pill i {
            color: #22c55e;
        }
        .back-btn {
            background: #22c55e;
            color: #fff;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .back-btn:hover {
            background: #16a34a;
        }
        #responseMessage {
            margin-top: 15px;
            font-size: 13px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- 1. የመጀመሪያው የኢሜይል ማስገቢያ ፎርም -->
        <div id="formState">
            <h2 style="margin: 0 0 10px 0; font-size: 24px;">Forgot Password</h2>
            <div style="color: #888; font-size: 14px; margin-bottom: 25px;">Enter your email and we'll send a secure reset link</div>

            <form id="forgotForm">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Send Reset Link</button>
            </form>
            <div id="responseMessage"></div>
        </div>

        <!-- 2. ኢሜይሉ ከተላከ በኋላ የሚመጣው Success State (እንደ ስክሪን ሾቱ) -->
        <div id="successState">
            <h2 style="margin: 0 0 10px 0; font-size: 24px;">Check your inbox</h2>
            <div style="color: #888; font-size: 14px; margin-bottom: 20px;">A reset link has been sent to</div>

            <div class="success-icon-container">
                <i class="fa-solid fa-check"></i>
            </div>

            <div class="email-pill">
                <i class="fa-solid fa-envelope"></i>
                <span id="sentEmailDisplay">binanceme73@gmail.com</span>
            </div>

            <div style="color: #777; font-size: 13px; margin-bottom: 25px;">
                Didn't receive it? Check your spam folder.
            </div>

            <a href="signin.html" class="back-btn">
                <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('responseMessage');
            
            const email = emailInput.value.trim();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            msgBox.style.display = 'none';

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();

                if (response.ok && data.success) {
                    // ኢሜይሉ በትክክል ከተላከ Form State ን ደብቆ Success State ን ማሳየት
                    document.getElementById('sentEmailDisplay').textContent = email;
                    document.getElementById('formState').style.display = 'none';
                    document.getElementById('successState').style.display = 'block';
                } else {
                    msgBox.style.display = 'block';
                    msgBox.style.background = '#331e1e';
                    msgBox.style.color = '#f87171';
                    msgBox.style.border = '1px solid #ef4444';
                    msgBox.textContent = data.message || 'Failed to send reset link.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            } catch (err) {
                console.error('Fetch Error:', err);
                msgBox.style.display = 'block';
                msgBox.style.background = '#331e1e';
                msgBox.style.color = '#f87171';
                msgBox.style.border = '1px solid #ef4444';
                msgBox.textContent = 'Server connection error. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
