<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Traders - TBR Exchange</title>
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-card: #181a20;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --gold: #f0b90b;
            --gold-hover: #fcd535;
            --border-color: #2b3139;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }
        
        .nav-brand {
            color: var(--gold);
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold);
        }

        /* Main Container */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header-sec {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header-sec h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .update-info {
            color: var(--text-muted);
            font-size: 13px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 4px;
        }

        /* Table Styling */
        .table-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 18px 25px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Rank Badges */
        .rank-badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            background: #2b3139;
            color: var(--text-main);
        }

        /* Top 3 Distinct Colors */
        .rank-1 {
            background: linear-gradient(135deg, #f0b90b, #fcd535);
            color: #000;
            box-shadow: 0 0 10px rgba(240, 185, 11, 0.3);
        }
        .rank-2 {
            background: linear-gradient(135deg, #d7d7d7, #ffffff);
            color: #000;
        }
        .rank-3 {
            background: linear-gradient(135deg, #b87333, #e29555);
            color: #fff;
        }

        /* Trader Info */
        .trader-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--border-color);
            object-fit: cover;
        }

        .trader-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .trader-name {
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trader-id {
            font-size: 13px;
            color: var(--text-muted);
        }

        .verified-badge {
            color: #0ecb81;
            font-size: 12px;
            background: rgba(14, 203, 129, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #0ecb81;
            border-radius: 50%;
            display: inline-block;
        }

        /* Stats Coloring */
        .volume {
            font-weight: bold;
            color: var(--text-main);
        }

        .usdt-text {
            color: var(--gold);
            font-size: 13px;
            margin-left: 4px;
        }

        .orders {
            color: var(--text-main);
            font-weight: 500;
        }

        .rate {
            color: #0ecb81;
            font-weight: 600;
        }

        .loader-row {
            text-align: center;
            padding: 50px !important;
            color: var(--gold);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .nav-links { display: none; } /* On mobile, use a hamburger menu in full code */
            th, td { padding: 12px 15px; }
            .header-sec { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">TBR Exchange</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="market.html">Market</a>
            <a href="trades.html">Trades</a>
            <a href="wallet.html">Wallet</a>
            <a href="leaderboard.html" class="active">🏆 Top Traders</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="header-sec">
            <h2>🏆 Top Volume Traders</h2>
            <div class="update-info">🔄 Auto-updates every 5 minutes</div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Trader</th>
                        <th>Volume (30d)</th>
                        <th>Completed Orders</th>
                        <th>Completion Rate</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr><td colspan="5" class="loader-row">Loading Top Traders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchLeaderboard);

        async function fetchLeaderboard() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            
            // Redirect to login if user is not authenticated
            if (!token) {
                window.location.href = 'signin.html';
                return;
            }

            try {
                const response = await fetch('/api/leaderboard', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = await response.json();
                const tbody = document.getElementById('leaderboard-body');
                
                if (result.success && result.data && result.data.length > 0) {
                    tbody.innerHTML = ''; // Clear loader
                    
                    result.data.forEach(trader => {
                        // Rank Coloring
                        let rankClass = '';
                        if (trader.rank === 1) rankClass = 'rank-1';
                        else if (trader.rank === 2) rankClass = 'rank-2';
                        else if (trader.rank === 3) rankClass = 'rank-3';

                        // Check if avatar is valid, else use UI Avatars with initial
                        const avatarSrc = trader.avatar || `https://ui-avatars.com/api/?name=${trader.name}&background=181a20&color=f0b90b&bold=true`;
                        
                        // Verification & Online Status
                        const verifiedHtml = (trader.kycStatus === 'verified' || trader.kycStatus === 'approved') 
                            ? `<span class="verified-badge">✔ Verified</span>` : '';
                        const onlineHtml = trader.isOnline ? `<span class="online-dot" title="Online"></span>` : '';

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>
                                <div class="rank-badge ${rankClass}">${trader.rank}</div>
                            </td>
                            <td>
                                <div class="trader-info">
                                    <img src="${avatarSrc}" alt="${trader.name}" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=${trader.name}&background=181a20&color=f0b90b'">
                                    <div class="trader-details">
                                        <div class="trader-name">
                                            ${trader.name} ${onlineHtml}
                                        </div>
                                        <div class="trader-id">
                                            ${trader.tbrId} &nbsp; ${verifiedHtml}
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="volume">
                                ${Number(trader.volume).toLocaleString('en-US', {minimumFractionDigits: 2})} 
                                <span class="usdt-text">USDT</span>
                            </td>
                            <td class="orders">${trader.tradesCount}</td>
                            <td class="rate">${trader.completionRate}</td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color:var(--text-muted);">No trading data available yet. Start trading to be the first!</td></tr>';
                }
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color:#f6465d;">Failed to load leaderboard. Please try refreshing the page.</td></tr>';
            }
        }
    </script>
</body>
</html>
