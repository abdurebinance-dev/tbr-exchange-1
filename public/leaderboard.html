<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Traders - TBR Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-card: #181a20;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --gold: #f0b90b;
            --border-color: #2b3139;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 35px;
        }
        
        .nav-brand img {
            height: 32px;
            display: block;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold);
        }

        .mobile-dash-btn {
            display: none;
            color: var(--gold);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            background: rgba(240, 185, 11, 0.1);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(240, 185, 11, 0.2);
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .header-sec {
            text-align: left;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-sec h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Loading Spinner */
        #main-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
            color: var(--gold);
            font-size: 16px;
            font-weight: 500;
            gap: 10px;
        }

        /* Top 3 Podium Image Style */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 50px;
            margin-top: 40px;
            margin-bottom: 60px;
        }

        .podium-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .podium-profile.rank-1 {
            order: 2;
            transform: scale(1.15);
            margin-bottom: 20px;
            z-index: 10;
        }
        .podium-profile.rank-2 { order: 1; }
        .podium-profile.rank-3 { order: 3; }

        .avatar-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
        }

        .podium-avatar {
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            background-color: var(--bg-card);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .rank-1 .podium-avatar {
            width: 90px;
            height: 90px;
            border-color: #f0b90b; 
            box-shadow: 0 0 20px rgba(240, 185, 11, 0.4);
        }
        .rank-2 .podium-avatar {
            width: 75px;
            height: 75px;
            border-color: #e6e6e6; 
        }
        .rank-3 .podium-avatar {
            width: 75px;
            height: 75px;
            border-color: #cd7f32; 
        }

        .podium-crown {
            position: absolute;
            top: -30px;
            color: #f0b90b;
            font-size: 38px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            z-index: 5;
        }

        .podium-number {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .podium-name {
            margin-top: 15px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-main);
            text-align: center;
            max-width: 120px;
            word-wrap: break-word;
        }

        .podium-score {
            color: var(--gold);
            font-size: 16px;
            font-weight: 800;
            margin-top: 6px;
        }

        /* Table Styling for Ranks 4+ */
        .table-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px; 
        }

        th, td {
            padding: 16px 15px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th:first-child, td:first-child {
            width: 60px;
            padding-right: 0px;
            text-align: center;
        }
        
        th:nth-child(2), td:nth-child(2) {
            padding-left: 10px;
        }

        th {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        td { font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        .rank-circle {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #2b3139;
            color: var(--text-main);
            font-weight: bold;
            font-size: 13px;
        }

        .trader-info-table {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .table-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .verified-badge {
            color: #0ecb81;
            font-size: 11px;
            background: rgba(14, 203, 129, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 8px;
        }

        .volume-td { color: var(--text-main); font-weight: bold; }
        .usdt-text { color: var(--gold); font-size: 12px; margin-left: 3px; }
        .rate-td { color: #0ecb81; font-weight: 600; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .nav-links { display: none; } 
            
            .mobile-dash-btn {
                display: flex;
            }
            
            .header-sec h2 { font-size: 22px; }
            
            .podium-container {
                gap: 15px;
                margin-top: 30px;
                margin-bottom: 40px;
            }
            .podium-profile.rank-1 { transform: scale(1.1); }
            
            .rank-1 .podium-avatar { width: 75px; height: 75px; }
            .rank-2 .podium-avatar, .rank-3 .podium-avatar { width: 60px; height: 60px; }
            
            .podium-crown { font-size: 28px; top: -22px; }
            .podium-number { font-size: 18px; margin-bottom: 8px; }
            .podium-name { font-size: 12px; max-width: 90px; }
            .podium-score { font-size: 13px; }

            th, td { padding: 12px 10px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="dashboard.html" class="nav-brand">
                <img src="logo.png" alt="TBR Exchange">
            </a>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="ads.html"><i class="fa-solid fa-bullhorn"></i> My Ads</a>
                <a href="trades.html"><i class="fa-solid fa-right-left"></i> Trades</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
                <a href="leaderboard.html" class="active"><i class="fa-solid fa-trophy"></i> Top Traders</a>
            </div>
        </div>
        
        <a href="dashboard.html" class="mobile-dash-btn">
            <i class="fa-solid fa-arrow-left"></i> Dashboard
        </a>
    </nav>

    <div class="container">
        <div class="header-sec">
            <h2>🏆 Top Volume Traders</h2>
        </div>

        <div id="main-loader" style="display: none;">
            <i class="fa-solid fa-spinner fa-spin"></i> Loading Top Traders...
        </div>

        <div class="podium-container" id="podium-container" style="display: none;">
        </div>

        <div class="table-container" id="table-wrapper" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Trader</th>
                        <th>Volume (30d)</th>
                        <th>Orders</th>
                        <th>Completion Rate</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cachedData = localStorage.getItem('tbr_leaderboard_data');
            if (cachedData) {
                try {
                    renderLeaderboardUI(JSON.parse(cachedData));
                } catch(e) {}
            } else {
                document.getElementById('main-loader').style.display = 'flex';
            }
            
            fetchLeaderboardFresh();
        });

        async function fetchLeaderboardFresh() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) {
                window.location.href = 'signin.html';
                return;
            }

            try {
                const response = await fetch('/api/leaderboard', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = await response.json();
                
                if (result.success && result.data) {
                    localStorage.setItem('tbr_leaderboard_data', JSON.stringify(result.data));
                    renderLeaderboardUI(result.data);
                }
            } catch (error) {
                console.error('Failed to fetch fresh leaderboard:', error);
                if (!localStorage.getItem('tbr_leaderboard_data')) {
                    document.getElementById('main-loader').innerHTML = 'Failed to load leaderboard.';
                    document.getElementById('main-loader').style.color = '#f6465d';
                }
            }
        }

        function renderLeaderboardUI(data) {
            document.getElementById('main-loader').style.display = 'none';

            if (data.length > 0) {
                const top3 = data.slice(0, 3);
                const rest = data.slice(3);

                const podiumContainer = document.getElementById('podium-container');
                if (top3.length > 0) {
                    podiumContainer.style.display = 'flex';
                    podiumContainer.innerHTML = '';
                    
                    top3.forEach(trader => {
                        let rankClass = trader.rank === 1 ? 'rank-1' : trader.rank === 2 ? 'rank-2' : 'rank-3';
                        const avatarSrc = trader.avatar || `https://ui-avatars.com/api/?name=TR&background=181a20&color=f0b90b&bold=true`;
                        
                        const topDecorator = trader.rank === 1 
                            ? '<i class="fa-solid fa-crown podium-crown"></i>' 
                            : `<div class="podium-number">${trader.rank}</div>`;

                        podiumContainer.innerHTML += `
                            <div class="podium-profile ${rankClass}">
                                ${trader.rank !== 1 ? topDecorator : ''}
                                <div class="avatar-wrapper">
                                    ${trader.rank === 1 ? topDecorator : ''}
                                    <img src="${avatarSrc}" loading="lazy" class="podium-avatar" onerror="this.src='https://ui-avatars.com/api/?name=TR&background=181a20&color=f0b90b'">
                                </div>
                                <div class="podium-name">${trader.name}</div>
                                <!-- Volume multiplied by 10 below -->
                                <div class="podium-score">${(Number(trader.volume) * 10).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                            </div>
                        `;
                    });
                }

                const tableWrapper = document.getElementById('table-wrapper');
                const tbody = document.getElementById('leaderboard-body');
                
                if (rest.length > 0) {
                    tableWrapper.style.display = 'block';
                    tbody.innerHTML = '';
                    
                    rest.forEach(trader => {
                        const avatarSrc = trader.avatar || `https://ui-avatars.com/api/?name=TR&background=181a20&color=f0b90b&bold=true`;
                        const verifiedHtml = (trader.kycStatus === 'verified' || trader.kycStatus === 'approved') 
                            ? `<span class="verified-badge"><i class="fa-solid fa-check"></i></span>` : '';

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><div class="rank-circle">${trader.rank}</div></td>
                            <td>
                                <div class="trader-info-table">
                                    <img src="${avatarSrc}" loading="lazy" class="table-avatar" onerror="this.src='https://ui-avatars.com/api/?name=TR&background=181a20&color=f0b90b'">
                                    <div style="font-weight:600; color:var(--text-main); display:flex; align-items:center;">
                                        ${trader.name} ${verifiedHtml}
                                    </div>
                                </div>
                            </td>
                            <!-- Volume multiplied by 10 below -->
                            <td class="volume-td">${(Number(trader.volume) * 10).toLocaleString('en-US', {minimumFractionDigits: 2})} <span class="usdt-text">USDT</span></td>
                            <td style="color:var(--text-main); font-weight:500;">${trader.tradesCount}</td>
                            <td class="rate-td">${trader.completionRate}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            } else {
                document.getElementById('podium-container').style.display = 'none';
                document.getElementById('table-wrapper').style.display = 'block';
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color:var(--text-muted);">No trading data available yet.</td></tr>';
            }
        }
    </script>
</body>
</html>
