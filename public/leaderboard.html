<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Traders - TBR Exchange</title>
    <!-- Add Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-card: #181a20;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --gold: #f0b90b;
            --gold-hover: #fcd535;
            --border-color: #2b3139;
        }
        
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* 2. & 3. Exact Dashboard Navbar Styling */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 40px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 35px; /* Space between logo and links */
        }
        
        .nav-brand img {
            height: 32px; /* Adjust TBR Logo size here */
            display: block;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--gold);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .verified-btn {
            background-color: rgba(14, 203, 129, 0.1);
            color: #0ecb81;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-right i {
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .nav-right i:hover {
            color: var(--text-main);
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .header-sec {
            text-align: left;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-sec h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 5. Top 3 Podium Design */
        .podium-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 50px;
        }

        .podium-card {
            background-color: var(--bg-card);
            border: 2px solid;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            width: 30%;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 1st Place */
        .podium-card.rank-1 {
            order: 2; 
            border-color: #f0b90b;
            transform: scale(1.1);
            z-index: 10;
            background: linear-gradient(180deg, rgba(240,185,11,0.1) 0%, var(--bg-card) 100%);
            box-shadow: 0 0 20px rgba(240, 185, 11, 0.2);
        }
        /* 2nd Place */
        .podium-card.rank-2 {
            order: 1;
            border-color: #c0c0c0;
            background: linear-gradient(180deg, rgba(192,192,192,0.1) 0%, var(--bg-card) 100%);
        }
        /* 3rd Place */
        .podium-card.rank-3 {
            order: 3;
            border-color: #cd7f32;
            background: linear-gradient(180deg, rgba(205,127,50,0.1) 0%, var(--bg-card) 100%);
        }

        .podium-rank {
            position: absolute;
            top: -15px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #000;
        }
        .rank-1 .podium-rank { background: radial-gradient(circle, #fcd535, #f0b90b); }
        .rank-2 .podium-rank { background: radial-gradient(circle, #ffffff, #c0c0c0); }
        .rank-3 .podium-rank { background: radial-gradient(circle, #ffa07a, #cd7f32); color: #fff; }

        .podium-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid var(--bg-main);
        }

        .podium-name {
            font-weight: bold;
            font-size: 16px;
            color: var(--text-main);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .podium-vol {
            color: var(--gold);
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .podium-stats {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* Table Styling for Ranks 4+ */
        .table-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto; /* 4. Mobile horizontal scroll */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px; /* Prevents squeezing on mobile */
        }

        th, td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        td { font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: rgba(255, 255, 255, 0.02); }

        .rank-circle {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #2b3139;
            color: var(--text-main);
            font-weight: bold;
            font-size: 13px;
        }

        .trader-info-table {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .table-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .verified-badge {
            color: #0ecb81;
            font-size: 11px;
            background: rgba(14, 203, 129, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .volume-td { color: var(--text-main); font-weight: bold; }
        .usdt-text { color: var(--gold); font-size: 12px; margin-left: 3px; }
        .rate-td { color: #0ecb81; font-weight: 600; }

        .loader-row { text-align: center; padding: 40px !important; color: var(--gold); }

        /* 4. Mobile Responsive Fixes */
        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; }
            .nav-links { display: none; } /* Hide links on very small screens, menu button handles it */
            .nav-right { gap: 15px; }
            
            .header-sec h2 { font-size: 22px; }
            
            /* Stack Podium Cards vertically on mobile */
            .podium-container {
                flex-direction: column;
                align-items: center;
                gap: 30px;
                margin-bottom: 30px;
            }
            .podium-card {
                width: 100%;
                order: initial !important; /* Reset order to 1, 2, 3 vertically */
                transform: none !important; /* Remove scaling */
            }
            .podium-card.rank-1 { order: 1 !important; height: auto; }
            .podium-card.rank-2 { order: 2 !important; height: auto; }
            .podium-card.rank-3 { order: 3 !important; height: auto; }
            
            th, td { padding: 12px 15px; }
        }
    </style>
</head>
<body>

    <!-- Corrected Navbar with Logo and Links on the Left -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="dashboard.html" class="nav-brand">
                <!-- 3. Using exact TBR Logo -->
                <img src="logo.png" alt="TBR Exchange">
            </a>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="ads.html"><i class="fa-solid fa-bullhorn"></i> My Ads</a>
                <a href="trades.html"><i class="fa-solid fa-right-left"></i> Trades</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
                <a href="leaderboard.html" class="active"><i class="fa-solid fa-trophy"></i> Top Traders</a>
            </div>
        </div>
        
        <div class="nav-right">
            <div class="verified-btn">
                <i class="fa-solid fa-check-circle"></i> Verified
            </div>
            <i class="fa-solid fa-moon"></i>
            <i class="fa-regular fa-bell"></i>
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- 1. Removed the Auto-update text -->
        <div class="header-sec">
            <h2>🏆 Top Volume Traders</h2>
        </div>

        <!-- 5. Top 3 Podium -->
        <div class="podium-container" id="podium-container" style="display: none;">
            <!-- Podium cards injected by JS -->
        </div>

        <!-- Rank 4 and below Table -->
        <div class="table-container" id="table-wrapper" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Trader</th>
                        <th>Volume (30d)</th>
                        <th>Orders</th>
                        <th>Completion Rate</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Table rows injected by JS -->
                </tbody>
            </table>
        </div>

        <!-- Loader -->
        <div id="loader" class="loader-row"><i class="fa-solid fa-spinner fa-spin"></i> Loading Top Traders...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', fetchLeaderboard);

        async function fetchLeaderboard() {
            const token = localStorage.getItem('token') || sessionStorage.getItem('token');
            if (!token) {
                window.location.href = 'signin.html';
                return;
            }

            try {
                const response = await fetch('/api/leaderboard', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = await response.json();
                
                document.getElementById('loader').style.display = 'none';

                if (result.success && result.data && result.data.length > 0) {
                    const top3 = result.data.slice(0, 3);
                    const rest = result.data.slice(3);

                    // 5. Render Top 3 Podium
                    const podiumContainer = document.getElementById('podium-container');
                    if (top3.length > 0) {
                        podiumContainer.style.display = 'flex';
                        top3.forEach(trader => {
                            let rankClass = trader.rank === 1 ? 'rank-1' : trader.rank === 2 ? 'rank-2' : 'rank-3';
                            const avatarSrc = trader.avatar || `https://ui-avatars.com/api/?name=${trader.name}&background=181a20&color=f0b90b&bold=true`;
                            const verifiedHtml = (trader.kycStatus === 'verified' || trader.kycStatus === 'approved') 
                                ? `<span class="verified-badge">✔ Verified</span>` : '';

                            // 4. TBR ID hidden
                            podiumContainer.innerHTML += `
                                <div class="podium-card ${rankClass}">
                                    <div class="podium-rank">#${trader.rank}</div>
                                    <img src="${avatarSrc}" class="podium-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=181a20&color=f0b90b'">
                                    <div class="podium-name">${trader.name} ${verifiedHtml}</div>
                                    <div class="podium-vol">${Number(trader.volume).toLocaleString('en-US', {minimumFractionDigits: 2})} <span class="usdt-text">USDT</span></div>
                                    <div class="podium-stats">${trader.tradesCount} Orders | ${trader.completionRate} Rate</div>
                                </div>
                            `;
                        });
                    }

                    // Render Rank 4+ Table
                    const tableWrapper = document.getElementById('table-wrapper');
                    const tbody = document.getElementById('leaderboard-body');
                    
                    if (rest.length > 0) {
                        tableWrapper.style.display = 'block';
                        rest.forEach(trader => {
                            const avatarSrc = trader.avatar || `https://ui-avatars.com/api/?name=${trader.name}&background=181a20&color=f0b90b&bold=true`;
                            const verifiedHtml = (trader.kycStatus === 'verified' || trader.kycStatus === 'approved') 
                                ? `<span class="verified-badge">✔ Verified</span>` : '';

                            // 4. TBR ID hidden
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td><div class="rank-circle">${trader.rank}</div></td>
                                <td>
                                    <div class="trader-info-table">
                                        <img src="${avatarSrc}" class="table-avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=181a20&color=f0b90b'">
                                        <div style="font-weight:600; color:var(--text-main); display:flex; align-items:center; gap:8px;">
                                            ${trader.name} ${verifiedHtml}
                                        </div>
                                    </div>
                                </td>
                                <td class="volume-td">${Number(trader.volume).toLocaleString('en-US', {minimumFractionDigits: 2})} <span class="usdt-text">USDT</span></td>
                                <td style="color:var(--text-main); font-weight:500;">${trader.tradesCount}</td>
                                <td class="rate-td">${trader.completionRate}</td>
                            `;
                            tbody.appendChild(row);
                        });
                    }
                } else {
                    document.getElementById('podium-container').style.display = 'none';
                    document.getElementById('table-wrapper').style.display = 'block';
                    document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color:var(--text-muted);">No trading data available yet.</td></tr>';
                }
            } catch (error) {
                document.getElementById('loader').innerHTML = 'Failed to load leaderboard.';
                document.getElementById('loader').style.color = '#f6465d';
            }
        }
    </script>
</body>
</html>
