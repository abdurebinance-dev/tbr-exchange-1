<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TBR Exchange</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
    <link rel="shortcut icon" type="image/png" href="/icon-192.png?v=3">
    <link rel="apple-touch-icon" href="/icon-192.png?v=3">
    <link rel="manifest" href="/manifest.json?v=3">
    <link rel="preconnect" href="https://tbr-exchange-backend.onrender.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0e11; color: #eaecef; min-height: 100vh; overflow-x: hidden; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #181a20; padding: 15px 30px; border-bottom: 1px solid #2b313a; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 22px; font-weight: bold; color: #f0b90b; letter-spacing: 1px; text-decoration: none; display: flex; align-items: center; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #848e9c; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .nav-links a:hover, .nav-links a.active { color: #f0b90b; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-right a { color: #eaecef; font-size: 16px; text-decoration: none; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .profile-header { background-color: #181a20; border: 1px solid #2b313a; border-radius: 12px; padding: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .profile-user-info { display: flex; align-items: center; gap: 20px; }
        .profile-avatar { width: 72px; height: 72px; background: linear-gradient(135deg, #f0b90b, #ff8c00); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #000; background-size: cover; background-position: center; background-repeat: no-repeat; overflow: hidden; flex-shrink: 0; border: 2px solid rgba(212, 175, 55, 0.5); background-color: rgba(212, 175, 55, 0.2); }
        .profile-details h2 { font-size: 20px; color: #fff; margin-bottom: 4px; display: flex; align-items: center; min-height: 24px; word-break: break-word; }
        .profile-details p { color: #848e9c; font-size: 14px; margin-bottom: 8px; min-height: 20px; word-break: break-all; }
        .user-id-badge { display: inline-flex; align-items: center; gap: 6px; background: #2b313a; padding: 3px 10px; border-radius: 4px; font-size: 12px; color: #f0b90b; font-family: monospace; }
        .user-id-badge span.copy-btn { color: #848e9c; cursor: pointer; transition: color 0.2s; }
        .user-id-badge span.copy-btn:hover { color: #f0b90b; }
        .settings-btn { background: #2b313a; color: #eaecef; border: 1px solid #474d57; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; transition: background 0.2s; }
        .settings-btn:hover { background: #363c4e; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background-color: #181a20; border: 1px solid #2b313a; border-radius: 8px; padding: 20px; text-align: center; }
        .stat-card .title { color: #848e9c; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-card .value { color: #fff; font-size: 18px; font-weight: bold; font-family: monospace; }
        .kyc-banner { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #181a20; border: 1px solid #2b313a; border-radius: 12px; margin-bottom: 25px; transition: all 0.3s ease; }
        .kyc-banner-left h4 { margin: 0 0 5px 0; font-size: 16px; min-height: 19px; }
        .kyc-banner-left p { color: #848e9c; margin: 0; font-size: 13px; min-height: 16px; }
        .verify-btn { border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 13px; transition: background 0.2s; display: inline-block; }
        .section-box { background-color: #181a20; border: 1px solid #2b313a; border-radius: 12px; padding: 25px; }
        .section-box h3 { font-size: 16px; color: #fff; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #2b313a; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #22262d; font-size: 14px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { color: #848e9c; }
        .detail-value { color: #eaecef; font-weight: 500; }
        @media (max-width: 768px) {
            html, body { overflow-x: hidden; width: 100%; }
            .navbar { padding: 12px 16px; }
            .nav-left { width: 100%; justify-content: space-between; gap: 12px; }
            .nav-links { gap: 14px; }
            .nav-links a { font-size: 13px; }
            .nav-links a.mobile-hide-link, .nav-right { display: none !important; }
            .container { margin: 18px auto; padding: 0 14px; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .profile-header { flex-direction: column; align-items: flex-start; gap: 15px; padding: 20px; }
            .kyc-banner { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="TBR Logo" style="height: 30px; object-fit: contain;">
            </a>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="my-ads.html"><i class="fa-solid fa-rectangle-ad"></i> My Ads</a>
                <a href="trades.html" class="mobile-hide-link"><i class="fa-solid fa-right-left"></i> Trades</a>
                <a href="wallet.html" class="mobile-hide-link"><i class="fa-solid fa-wallet"></i> Wallet</a>
                <a href="top-traders.html" class="mobile-hide-link"><i class="fa-solid fa-trophy"></i> Top Traders</a>
            </div>
        </div>
        <div class="nav-right">
            <a href="notifications.html"><i class="fa-regular fa-bell"></i></a>
            <a href="profile.html" style="color: #f0b90b;"><i class="fa-solid fa-user"></i></a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-user-info">
                <div class="profile-avatar" id="avatarInitial"></div>
                <div class="profile-details">
                    <h2 id="profileName"></h2>
                    <p id="profileEmail"></p>
                    <div class="user-id-badge">
                        ID: <span id="userUniqueId"></span>
                        <span class="copy-btn" id="copyIdBtn" title="Copy ID">
                            <i class="fa-regular fa-copy"></i> <span id="copyText">Copy</span>
                        </span>
                    </div>
                </div>
            </div>
            <a href="settings.html" class="settings-btn"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="title">Reputation</div>
                <div class="value" id="statReputation">0%</div>
            </div>
            <div class="stat-card">
                <div class="title">Total Trades</div>
                <div class="value" id="statTotalTrades">0</div>
            </div>
            <div class="stat-card">
                <div class="title">Completion Rate</div>
                <div class="value" id="statCompletionRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="title">Volume</div>
                <div class="value" id="statVolume">0 USDT</div>
            </div>
        </div>

        <!-- KYC Verification Banner -->
        <div id="kycBannerContainer" class="kyc-banner">
            <div class="kyc-banner-left">
                <h4 id="kycBannerTitle"></h4>
                <p id="kycBannerDesc"></p>
            </div>
            <div id="kycBannerAction">
                <!-- Action button loads here -->
            </div>
        </div>

        <!-- Account Details Box -->
        <div class="section-box">
            <h3>Account Details</h3>
            
            <div class="detail-row">
                <span class="detail-label">KYC Verification</span>
                <span class="detail-value" id="kycStatusRowText"></span>
            </div>
            
            <div class="detail-row">
                <span class="detail-label">Two-Factor Auth (2FA)</span>
                <span class="detail-value" id="twoFactorStatus" style="color: #f6465d;">Disabled</span>
            </div>
            
            <div class="detail-row">
                <span class="detail-label">Member Since</span>
                <span class="detail-value" id="memberSince">2026</span>
            </div>
        </div>

    </div>

    <!-- 🔴 ራሱን የቻለ አዲስ የ Profile ጃቫስክሪፕት ፋይል 🔴 -->
    <script src="profile.js"></script>
</body>
</html>
