<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TBR Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #080808;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            padding-top: 75px;
            padding-bottom: 70px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #121212;
            border-bottom: 1px solid #262626;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-sizing: border-box;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .logo-container img {
            height: 32px;
            width: auto;
            object-fit: contain;
            display: block;
        }
        .nav-links {
            display: flex;
            gap: 15px;
        }
        .nav-links a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .nav-links a.active, .nav-links a:hover {
            color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #aaa;
            font-size: 16px;
        }

        @media(max-width: 900px) {
            .navbar .nav-links { display: none; }
            .navbar { padding: 12px 15px; }
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .profile-info-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .profile-avatar {
            width: 70px;
            height: 70px;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 28px;
            font-weight: bold;
        }
        .profile-details h2 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #fff;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }
        .profile-details p {
            margin: 0;
            font-size: 13px;
            color: #888;
        }
        .settings-btn {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: 0.2s;
        }
        .settings-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .label {
            font-size: 11px;
            color: #777;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
        }

        .section-box {
            background: #121212;
            border: 1px solid #262626;
            border-radius: 18px;
            padding: 25px;
        }
        .section-box h3 {
            margin: 0 0 20px 0;
            font-size: 16px;
            color: #fff;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #1a1a1a;
            font-size: 13px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-row span:first-child { color: #888; }
        .info-row span:last-child { color: #fff; font-weight: 500; }

        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #121212;
            border-top: 1px solid #262626;
            padding: 8px 0;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .mobile-bottom-nav a {
            color: #888;
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .mobile-bottom-nav a.active { color: #d4af37; }
        @media(max-width: 900px) {
            .mobile-bottom-nav { display: flex; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .profile-card { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <img src="logo.png" alt="TBR Exchange Logo">
            </div>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="my-ads.html"><i class="fa-solid fa-bullhorn"></i> My Ads</a>
                <a href="trades.html"><i class="fa-solid fa-right-left"></i> Trades</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
                <a href="leaderboard.html"><i class="fa-solid fa-trophy"></i> Top Traders</a>
            </div>
        </div>
        <div class="nav-right">
            <a href="notifications.html" style="color: inherit; text-decoration: none;"><i class="fa-regular fa-bell"></i></a>
            <a href="dashboard.html" style="color: #d4af37; text-decoration: none; font-size: 18px;"><i class="fa-solid fa-house"></i></a>
        </div>
    </div>

    <div class="container">
        <div class="profile-card">
            <div class="profile-info-left">
                <div class="profile-avatar" id="avatarInitial">U</div>
                <div class="profile-details">
                    <h2 id="profileName">USER</h2>
                    <p class="user-email" id="profileEmail">user@example.com</p>
                    <div class="user-id-container" style="display: flex; align-items: center; gap: 8px; margin-top: 4px;">
                        <span id="userUniqueId" style="color: #f3ba2f; font-size: 13px; font-weight: 600;">TBR-000000</span>
                        <button id="copyBtn" onclick="copyUserId()" title="Copy ID" style="background: transparent; border: none; color: #888; cursor: pointer; padding: 0; font-size: 12px; display: flex; align-items: center; gap: 4px;">
                            <i class="fas fa-copy"></i> <span id="copyText">Copy</span>
                        </button>
                    </div>
                </div>
            </div>
            <a href="settings.html" class="settings-btn"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>

        <div id="kycBannerContainer"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Reputation</div>
                <div class="value">100%</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Trades</div>
                <div class="value">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Completion Rate</div>
                <div class="value">100%</div>
            </div>
            <div class="stat-card">
                <div class="label">Volume</div>
                <div class="value">0 USDT</div>
            </div>
        </div>

        <div class="section-box">
            <h3>Account Details</h3>
            <div class="info-row">
                <span>KYC Verification</span>
                <span id="kycStatusRowText"><a href="kyc-verify.html" style="color: #f6465d; text-decoration: none;">Not Submitted <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i></a></span>
            </div>
            <div class="info-row">
                <span>Two-Factor Auth (2FA)</span>
                <span style="color: #f6465d;">Disabled</span>
            </div>
            <div class="info-row">
                <span>Member Since</span>
                <span id="memberSince">2026</span>
            </div>
        </div>
    </div>

    <div class="mobile-bottom-nav">
        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="wallet.html">
            <i class="fa-solid fa-wallet"></i>
            <span>Wallet</span>
        </a>
        <a href="market.html">
            <i class="fa-solid fa-store"></i>
            <span>Market</span>
        </a>
        <a href="profile.html" class="active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
    </div>

    <script>
        function copyUserId() {
            const userIdText = document.getElementById('userUniqueId').innerText;
            navigator.clipboard.writeText(userIdText).then(() => {
                const copyTextSpan = document.getElementById('copyText');
                copyTextSpan.innerText = 'Copied!';
                copyTextSpan.style.color = '#00C087';
                setTimeout(() => {
                    copyTextSpan.innerText = 'Copy';
                    copyTextSpan.style.color = '#888';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        async function loadUserProfile() {
            let name = localStorage.getItem('userName') || localStorage.getItem('name') || "USER";
            let email = localStorage.getItem('userEmail') || localStorage.getItem('email') || "user@example.com";
            let kycStatus = localStorage.getItem('kycStatus') || 'not_submitted';
            
            // የ ተጠቃሚውን ID ከተለያየ የቁልፍ ስሞች ለመፈለግ (ከሌለ በ ID ሰሌዳ ወይም በ MongoDB _id ላይ በመመስረት ፎርማት ይደረጋል)
            let rawId = localStorage.getItem('userId') || localStorage.getItem('userUniqueId') || localStorage.getItem('_id');
            let userId = 'TBR-000000';
            if (rawId && rawId !== 'undefined' && rawId !== 'null') {
                // መለያው ቁጥር ብቻ ከሆነ ከፊት TBR- ጨምሮ በ 6 ዲጂት እንዲሆን ማድረግ
                if (/^\d+$/.test(rawId)) {
                    userId = 'TBR-' + String(rawId).padStart(6, '0');
                } else if (rawId.startsWith('TBR-')) {
                    userId = rawId;
                } else {
                    // ሐሺሽ (MongoDB ObjectId) ከሆነ የመጨረሻዎቹን 6 ቁምፊዎች ወይም ኢንዴክስ መጠቀም ይቻላል
                    userId = 'TBR-' + rawId.slice(-6).toUpperCase();
                }
            }

            let displayName = name.toUpperCase();
            document.getElementById('profileName').innerText = displayName;
            document.getElementById('profileEmail').innerText = email;
            document.getElementById('userUniqueId').innerText = userId;
            document.getElementById('avatarInitial').innerText = displayName.charAt(0).toUpperCase();

            try {
                const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch('/api/auth/me', { headers });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.user) {
                        name = data.user.fullName || data.user.name || name;
                        email = data.user.email || email;
                        kycStatus = data.user.kycStatus || (data.user.isVerified ? 'verified' : kycStatus);
                        
                        let serverId = data.user.userId || data.user.id || data.user._id;
                        if (serverId) {
                            if (/^\d+$/.test(serverId)) {
                                userId = 'TBR-' + String(serverId).padStart(6, '0');
                            } else if (serverId.startsWith('TBR-')) {
                                userId = serverId;
                            } else {
                                userId = 'TBR-' + String(serverId).slice(-6).toUpperCase();
                            }
                        }
                        
                        displayName = name.toUpperCase();
                        document.getElementById('profileName').innerText = displayName;
                        document.getElementById('profileEmail').innerText = email;
                        document.getElementById('userUniqueId').innerText = userId;
                        document.getElementById('avatarInitial').innerText = displayName.charAt(0).toUpperCase();

                        localStorage.setItem('userName', name);
                        localStorage.setItem('userEmail', email);
                        localStorage.setItem('kycStatus', kycStatus);
                        localStorage.setItem('userUniqueId', userId);
                    }
                }
            } catch (e) {
                console.log("Could not fetch from server, using local cache.");
            }

            const bannerContainer = document.getElementById('kycBannerContainer');
            const nameContainer = document.getElementById('profileName');
            const kycStatusRowText = document.getElementById('kycStatusRowText');

            if (kycStatus === 'verified' || kycStatus === 'approved' || kycStatus === true) {
                nameContainer.innerHTML = `
                    ${displayName} 
                    <span style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #00C087; color: #fff; border-radius: 50%; font-size: 10px; margin-left: 8px;" title="Verified">
                        <i class="fa-solid fa-check"></i>
                    </span>
                `;
                kycStatusRowText.innerHTML = `<span style="color: #00C087; font-weight: 600;">Verified <i class="fa-solid fa-circle-check"></i></span>`;
            } else if (kycStatus === 'pending' || kycStatus === 'under_review') {
                nameContainer.innerHTML = displayName;
                kycStatusRowText.innerHTML = `<span style="color: #f0b90b; font-weight: 500;">Under Review</span>`;
            } else if (kycStatus === 'rejected') {
                nameContainer.innerHTML = displayName;
                kycStatusRowText.innerHTML = `<a href="kyc-verify.html" style="color: #cf304a; text-decoration: none;">Rejected (Resubmit) <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i></a>`;
            } else {
                nameContainer.innerHTML = displayName;
                kycStatusRowText.innerHTML = `<a href="kyc-verify.html" style="color: #f6465d; text-decoration: none;">Not Submitted <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i></a>`;
            }

            if (kycStatus === 'not_submitted' || !kycStatus) {
                bannerContainer.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px;">
                        <div>
                            <h4 style="color: #f0b90b; margin: 0 0 5px 0;">Identity not verified</h4>
                            <p style="color: #848e9c; margin: 0; font-size: 13px;">Verify your ID to post ads and unlock higher limits.</p>
                        </div>
                        <button onclick="window.location.href='kyc-verify.html'" style="background: #f0b90b; color: #000; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">VERIFY IDENTITY</button>
                    </div>
                `;
            } else if (kycStatus === 'pending' || kycStatus === 'under_review') {
                bannerContainer.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px;">
                        <div>
                            <h4 style="color: #f0b90b; margin: 0 0 5px 0;">Verification under review</h4>
                            <p style="color: #848e9c; margin: 0; font-size: 13px;">We'll notify you by email. Typically 1-2 business days.</p>
                        </div>
                        <div style="color: #f0b90b; font-size: 20px;"><i class="fa-solid fa-shield-halved"></i></div>
                    </div>
                `;
            } else if (kycStatus === 'verified' || kycStatus === 'approved' || kycStatus === true) {
                bannerContainer.innerHTML = `
                    <div style="padding: 15px 20px; background: #1a1a1a; border: 1px solid #00C087; border-radius: 8px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                        <span style="color: #00C087; font-size: 18px;">✔</span>
                        <span style="color: #00C087; font-weight: bold;">Verified Identity - Your account is fully verified.</span>
                    </div>
                `;
            } else if (kycStatus === 'rejected') {
                bannerContainer.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #1a1a1a; border: 1px solid #cf304a; border-radius: 8px; margin-bottom: 20px;">
                        <div>
                            <h4 style="color: #cf304a; margin: 0 0 5px 0;">Verification Rejected</h4>
                            <p style="color: #848e9c; margin: 0; font-size: 13px;">Please re-submit your correct documents for verification.</p>
                        </div>
                        <button onclick="window.location.href='kyc-verify.html'" style="background: #cf304a; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">RESUBMIT</button>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadUserProfile);
    </script>
</body>
</html>
