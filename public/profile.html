<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - TBR Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e11;
            color: #eaecef;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #181a20;
            padding: 15px 30px;
            border-bottom: 1px solid #2b313a;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #f0b90b;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #848e9c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #f0b90b;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-right a {
            color: #eaecef;
            font-size: 16px;
            text-decoration: none;
        }

        /* Main Container */
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Profile Header Card */
        .profile-header {
            background-color: #181a20;
            border: 1px solid #2b313a;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .profile-user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #f0b90b, #ff8c00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #000;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .profile-details h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            min-height: 24px;
        }

        .profile-details p {
            color: #848e9c;
            font-size: 14px;
            margin-bottom: 8px;
            min-height: 20px;
        }

        .user-id-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #2b313a;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #f0b90b;
            font-family: monospace;
        }

        .user-id-badge span.copy-btn {
            color: #848e9c;
            cursor: pointer;
            transition: color 0.2s;
        }

        .user-id-badge span.copy-btn:hover {
            color: #f0b90b;
        }

        .settings-btn {
            background: #2b313a;
            color: #eaecef;
            border: 1px solid #474d57;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .settings-btn:hover {
            background: #363c4e;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: #181a20;
            border: 1px solid #2b313a;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .title {
            color: #848e9c;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }

        /* KYC Banner Styles */
        .kyc-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #181a20;
            border: 1px solid #2b313a;
            border-radius: 12px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }

        .kyc-banner-left h4 {
            margin: 0 0 5px 0;
            font-size: 16px;
            min-height: 19px;
        }

        .kyc-banner-left p {
            color: #848e9c;
            margin: 0;
            font-size: 13px;
            min-height: 16px;
        }

        .verify-btn {
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            transition: background 0.2s;
            display: inline-block;
        }

        /* Account Details Section */
        .section-box {
            background-color: #181a20;
            border: 1px solid #2b313a;
            border-radius: 12px;
            padding: 25px;
        }

        .section-box h3 {
            font-size: 16px;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2b313a;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #22262d;
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #848e9c;
        }

        .detail-value {
            color: #eaecef;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }
            .profile-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .kyc-banner {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="TBR Logo" style="height: 30px; object-fit: contain;">
            </a>
            <div class="nav-links">
                <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="market.html"><i class="fa-solid fa-store"></i> Market</a>
                <a href="my-ads.html"><i class="fa-solid fa-rectangle-ad"></i> My Ads</a>
                <a href="trades.html"><i class="fa-solid fa-right-left"></i> Trades</a>
                <a href="wallet.html"><i class="fa-solid fa-wallet"></i> Wallet</a>
                <a href="top-traders.html"><i class="fa-solid fa-trophy"></i> Top Traders</a>
            </div>
        </div>
        <div class="nav-right">
            <a href="notifications.html"><i class="fa-regular fa-bell"></i></a>
            <a href="profile.html" style="color: #f0b90b;"><i class="fa-solid fa-user"></i></a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-user-info">
                <div class="profile-avatar" id="avatarInitial" style="background-color: rgba(212, 175, 55, 0.25); border: 2px solid rgba(212, 175, 55, 0.5);"></div>
                <div class="profile-details">
                    <h2 id="profileName"></h2>
                    <p id="profileEmail"></p>
                    <div class="user-id-badge">
                        ID: <span id="userUniqueId"></span>
                        <span class="copy-btn" onclick="copyUserId()" title="Copy ID">
                            <i class="fa-regular fa-copy"></i> <span id="copyText">Copy</span>
                        </span>
                    </div>
                </div>
            </div>
            <a href="settings.html" class="settings-btn"><i class="fa-solid fa-gear"></i> Settings</a>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="title">Reputation</div>
                <div class="value" id="statReputation">100%</div>
            </div>
            <div class="stat-card">
                <div class="title">Total Trades</div>
                <div class="value" id="statTotalTrades">0</div>
            </div>
            <div class="stat-card">
                <div class="title">Completion Rate</div>
                <div class="value" id="statCompletionRate">100%</div>
            </div>
            <div class="stat-card">
                <div class="title">Volume</div>
                <div class="value" id="statVolume">0 USDT</div>
            </div>
        </div>

        <!-- KYC Verification Banner -->
        <div id="kycBannerContainer" class="kyc-banner">
            <div class="kyc-banner-left">
                <h4 id="kycBannerTitle"></h4>
                <p id="kycBannerDesc"></p>
            </div>
            <div id="kycBannerAction">
                <!-- Action button loads here -->
            </div>
        </div>

        <!-- Account Details Box -->
        <div class="section-box">
            <h3>Account Details</h3>
            
            <div class="detail-row">
                <span class="detail-label">KYC Verification</span>
                <span class="detail-value" id="kycStatusRowText"></span>
            </div>
            
            <div class="detail-row">
                <span class="detail-label">Two-Factor Auth (2FA)</span>
                <span class="detail-value" id="twoFactorStatus" style="color: #f6465d;">Disabled</span>
            </div>
            
            <div class="detail-row">
                <span class="detail-label">Member Since</span>
                <span class="detail-value" id="memberSince">2026</span>
            </div>
        </div>

    </div>

    <!-- Script to Load Profile and Manage IDs & KYC States -->
    <script>
        function copyUserId() {
            const userIdText = document.getElementById('userUniqueId').innerText;
            if (!userIdText || userIdText.includes('Loading') || userIdText.includes('TBR-000000') || userIdText.includes('TBR------')) return;
            
            navigator.clipboard.writeText(userIdText).then(() => {
                const copyTextSpan = document.getElementById('copyText');
                copyTextSpan.innerText = 'Copied!';
                copyTextSpan.style.color = '#00C087';
                setTimeout(() => {
                    copyTextSpan.innerText = 'Copy';
                    copyTextSpan.style.color = '#848e9c';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }

        // 1. ወዲያውኑ ዩአይን የሚያዘምነው ዋና ፋንክሽን (Loading የሚለውን አስቀርተነዋል)
        function updateProfileUI() {
            let name = localStorage.getItem('userName') || localStorage.getItem('fullName') || localStorage.getItem('name') || "USER";
            let email = localStorage.getItem('userEmail') || localStorage.getItem('email') || "";
            let kycStatus = String(localStorage.getItem('kycStatus') || 'not_submitted').toLowerCase();
            let rejectionReason = localStorage.getItem('kycRejectionReason') || 'Document check failed';
            let storedFullName = localStorage.getItem('fullName') || '';
            
            // 🔴 ሎዲንግ ሳይል ትክክለኛውን አይዲ ከሚሞሪ ያወጣል
            let userId = localStorage.getItem('tbrExchangeId') || localStorage.getItem('userUniqueId') || localStorage.getItem('tbrId') || '';
            
            let savedAvatar = localStorage.getItem('userAvatar') || localStorage.getItem('profilePicture') || localStorage.getItem('profilePic');
            
            let totalTrades = localStorage.getItem('totalTrades') || '0';
            let volume = localStorage.getItem('volume') || '0 USDT';
            let completionRate = localStorage.getItem('completionRate') || '100%';
            let reputation = localStorage.getItem('reputation') || '100%';
            let is2FA = localStorage.getItem('is2FA') === 'true' || localStorage.getItem('twoFactorEnabled') === 'true';
            let memberSince = localStorage.getItem('memberSince') || '2026';

            const usernameFallback = (name && name !== "USER") ? name : (email ? email.split('@')[0] : 'User');
            const displayName = (kycStatus === 'approved' || kycStatus === 'verified') && storedFullName 
                ? storedFullName 
                : usernameFallback;

            // Update basic text elements
            document.getElementById('profileEmail').innerText = email;
            document.getElementById('userUniqueId').innerText = userId;
            document.getElementById('statTotalTrades').innerText = totalTrades;
            document.getElementById('statVolume').innerText = volume;
            document.getElementById('statCompletionRate').innerText = completionRate;
            document.getElementById('statReputation').innerText = reputation;
            document.getElementById('memberSince').innerText = memberSince;

            // Update 2FA
            const twoFactorEl = document.getElementById('twoFactorStatus');
            if (is2FA) {
                twoFactorEl.innerText = 'Enabled';
                twoFactorEl.style.color = '#00C087';
            } else {
                twoFactorEl.innerText = 'Disabled';
                twoFactorEl.style.color = '#f6465d';
            }

            // Update Avatar
            const avatarBox = document.getElementById('avatarInitial');
            if (savedAvatar && savedAvatar !== 'null' && savedAvatar !== 'undefined' && savedAvatar.trim() !== "") {
                avatarBox.style.backgroundImage = `url('${savedAvatar}')`;
                avatarBox.style.backgroundSize = "cover";
                avatarBox.style.backgroundPosition = "center";
                avatarBox.innerText = "";
            } else {
                avatarBox.style.backgroundImage = "none";
                avatarBox.innerText = String(displayName).charAt(0).toUpperCase();
            }

            // Update KYC and Name
            const nameContainer = document.getElementById('profileName');
            const kycStatusRowText = document.getElementById('kycStatusRowText');
            const bannerTitle = document.getElementById('kycBannerTitle');
            const bannerDesc = document.getElementById('kycBannerDesc');
            const bannerAction = document.getElementById('kycBannerAction');
            const bannerContainer = document.getElementById('kycBannerContainer');

            if (kycStatus === 'not_submitted' || kycStatus === 'unverified') {
                nameContainer.innerHTML = displayName.toUpperCase();
                kycStatusRowText.innerHTML = `<a href="kyc-verify.html" style="color: #f6465d; text-decoration: none;">Not Submitted <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i></a>`;
                bannerContainer.style.borderColor = '#f6465d';
                bannerContainer.style.background = 'rgba(246, 70, 93, 0.05)';
                bannerTitle.innerText = "Identity not verified";
                bannerTitle.style.color = "#f6465d";
                bannerDesc.innerText = "Verify your ID to post ads and unlock 10× higher limits.";
                bannerAction.innerHTML = `<a href="kyc-verify.html" class="verify-btn" style="background:#f6465d; color:#fff;">VERIFY IDENTITY</a>`;
            } 
            else if (kycStatus === 'pending' || kycStatus === 'under_review') {
                nameContainer.innerHTML = displayName.toUpperCase();
                kycStatusRowText.innerHTML = `<span style="color: #f3ba2f; font-weight: 500;">Under Review</span>`;
                bannerContainer.style.borderColor = '#f3ba2f';
                bannerContainer.style.background = 'rgba(243, 186, 47, 0.05)';
                bannerTitle.innerText = "Under Review";
                bannerTitle.style.color = "#f3ba2f";
                bannerDesc.innerText = "You are under review. Please wait for admin verification. Action disabled.";
                bannerAction.innerHTML = `<span style="color:#f3ba2f; font-size:13px; font-weight:500;">Under Review</span>`;
            } 
            else if (kycStatus === 'verified' || kycStatus === 'approved') {
                nameContainer.innerHTML = `${displayName.toUpperCase()} <span style="display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #0ecb81; color: #fff; border-radius: 50%; font-size: 10px; margin-left: 8px;" title="Verified"><i class="fa-solid fa-check"></i></span>`;
                kycStatusRowText.innerHTML = `<span style="color: #0ecb81; font-weight: 600;">Verified <i class="fa-solid fa-circle-check"></i></span>`;
                bannerContainer.style.borderColor = '#0ecb81';
                bannerContainer.style.background = 'rgba(14, 203, 129, 0.05)';
                bannerTitle.innerText = "Approved";
                bannerTitle.style.color = "#0ecb81";
                bannerDesc.innerText = "Your identity verification is approved. Full access unlocked.";
                bannerAction.innerHTML = "";
            } 
            else if (kycStatus === 'rejected') {
                nameContainer.innerHTML = displayName.toUpperCase();
                kycStatusRowText.innerHTML = `<a href="kyc-verify.html" style="color: #f6465d; text-decoration: none;">Rejected (Resubmit) <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i></a>`;
                bannerContainer.style.borderColor = '#f6465d';
                bannerContainer.style.background = 'rgba(246, 70, 93, 0.05)';
                bannerTitle.innerText = "Rejected";
                bannerTitle.style.color = "#f6465d";
                bannerDesc.innerText = `Reason: ${rejectionReason}`;
                bannerAction.innerHTML = `<a href="kyc-verify.html" class="verify-btn" style="background:#f6465d; color:#fff;">Resubmit ID</a>`;
            }
        }

        // 2. ከሰርቨር ጋር በጀርባ ዳታ የሚያመሳስል ፋንክሽን
        async function syncWithServer() {
            try {
                const token = localStorage.getItem('token') || localStorage.getItem('authToken');
                if (!token) return;

                const response = await fetch('https://tbr-exchange-backend.onrender.com/api/user/profile', {
                    method: 'GET',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const user = data.user || data.data || data;
                    
                    if (user) {
                        if (user.fullName) localStorage.setItem('userName', user.fullName);
                        if (user.name) localStorage.setItem('name', user.name);
                        if (user.email) localStorage.setItem('userEmail', user.email);
                        if (user.kycStatus) localStorage.setItem('kycStatus', user.kycStatus);
                        if (user.kycRejectionReason) localStorage.setItem('kycRejectionReason', user.kycRejectionReason);
                        
                        // የአይዲ (ID) ማዘመኛ
                        if (user.userId) {
                            localStorage.setItem('tbrExchangeId', user.userId);
                            localStorage.setItem('tbrId', user.userId);
                        } else if (user.numericId) {
                            const newId = 'TBR-' + String(user.numericId).padStart(6, '0');
                            localStorage.setItem('tbrExchangeId', newId);
                            localStorage.setItem('tbrId', newId);
                        } else if (user.customId) {
                            localStorage.setItem('tbrExchangeId', user.customId);
                            localStorage.setItem('tbrId', user.customId);
                        }
                        
                        // የአቫታር ማዘመኛ
                        if (user.avatar && user.avatar !== 'null' && user.avatar.trim() !== '') {
                            localStorage.setItem('userAvatar', user.avatar);
                            localStorage.setItem('profilePicture', user.avatar);
                        }

                        // አዲሱን ዳታ ተጠቅሞ ዩአይን በድጋሚ ያድሳል
                        updateProfileUI();
                    }
                }
            } catch (e) {
                console.log("Could not fetch from server, continuing with local cache.", e);
            }
        }

        // 3. ፔጁ ሲከፈት ሁለቱን ፋንክሽኖች በቅደም ተከተል ያስነሳል
        document.addEventListener("DOMContentLoaded", () => {
            updateProfileUI();
            syncWithServer();
        });
    </script>
</body>
</html>
