<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBR Exchange - My Ads</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #121212;
            --card-darker: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #2b313a;
            --accent-color: #0ecb81;
            --accent-hover: #0b9e65;
            --red-color: #f6465d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline:hover { color: #fff; border-color: var(--text-muted); }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease; }

        .ads-tabs-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .ads-tab {
            flex: 1; text-align: center; padding: 12px; color: var(--text-muted);
            font-size: 13px; font-weight: 600; cursor: pointer; border-right: 1px solid var(--border-color);
        }
        .ads-tab.active { color: #000; background: var(--accent-color); }

        .ads-sub-tabs {
            display: flex; background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; margin-bottom: 20px; overflow: hidden;
        }
        .sub-tab {
            flex: 1; text-align: center; padding: 10px; font-size: 13px; color: var(--text-muted);
            cursor: pointer;
        }
        .sub-tab.active { color: #fff; border-bottom: 2px solid var(--accent-color); background: rgba(14, 203, 129, 0.05); }

        .empty-state {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .empty-state i { font-size: 32px; color: #2b313a; margin-bottom: 15px; }
        .empty-state h3 { margin: 0 0 8px 0; font-size: 15px; color: #fff; }
        .empty-state p { color: var(--text-muted); font-size: 13px; margin-bottom: 15px; }

        .form-container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        
        .trade-type-toggle { display: flex; gap: 15px; margin-bottom: 25px; }
        .toggle-btn {
            flex: 1; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted);
            padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s;
        }
        .toggle-btn.btn-buy.active { border-color: var(--accent-color); color: var(--accent-color); background: rgba(14, 203, 129, 0.05); }
        .toggle-btn.btn-sell.active { border-color: var(--red-color); color: var(--red-color); background: rgba(246, 70, 93, 0.05); }

        .form-section { margin-bottom: 25px; background: var(--card-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 10px; }
        .form-section h4 { font-size: 14px; font-weight: 600; margin: 0 0 10px 0; color: #fff; }
        
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
        .input-group input {
            width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
            color: #fff; padding: 12px 15px; border-radius: 6px; box-sizing: border-box; font-size: 13px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent-color); }
        .suffix { position: absolute; right: 15px; top: 32px; color: var(--text-muted); font-size: 12px; font-weight: 600; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container view-section active" id="view-main-ads">
        <div class="top-bar">
            <h1>Your Ads</h1>
            <button class="btn-primary" onclick="switchView('view-post-order')">
                <i class="fa-solid fa-plus"></i> New Ad
            </button>
        </div>

        <div class="ads-tabs-wrapper">
            <div class="ads-tab active"><i class="fa-regular fa-file-lines"></i> Ads</div>
            <div class="ads-tab"><i class="fa-solid fa-bolt"></i> Boost History</div>
        </div>

        <div class="ads-sub-tabs">
            <div class="sub-tab active">All</div>
            <div class="sub-tab">Active</div>
            <div class="sub-tab">Paused</div>
            <div class="sub-tab">Cancelled</div>
        </div>

        <div class="empty-state">
            <i class="fa-regular fa-clipboard"></i>
            <h3>No ads yet</h3>
            <p>Post your first P2P trade offer</p>
            <button class="btn-primary" onclick="switchView('view-post-order')">
                <i class="fa-solid fa-plus"></i> Post an Ad
            </button>
        </div>
    </div>

    <div class="container view-section" id="view-post-order">
        <div class="top-bar" style="border:none; margin-bottom:15px;">
            <button class="btn-outline" onclick="switchView('view-main-ads')">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
        </div>

        <div class="form-container">
            <h2 style="font-size: 20px; margin-bottom: 5px;">Post Order</h2>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Set your rate, limits, and payment methods</p>

            <div class="trade-type-toggle">
                <button class="toggle-btn btn-buy active" onclick="setTradeType('buy', this)">
                    <i class="fa-solid fa-arrow-down"></i> Buy USDT
                </button>
                <button class="toggle-btn btn-sell" onclick="setTradeType('sell', this)">
                    <i class="fa-solid fa-arrow-up"></i> Sell USDT
                </button>
            </div>

            <div class="form-section">
                <h4>Price per USDT</h4>
                <div class="input-group">
                    <input type="number" placeholder="e.g. 125.50" value="125.50">
                    <span class="suffix">ETB</span>
                </div>
            </div>

            <div class="form-section">
                <h4>Total Amount</h4>
                <div class="input-group">
                    <input type="number" placeholder="e.g. 500">
                    <span class="suffix">USDT</span>
                </div>
            </div>

            <button id="review-order-btn" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 14px; border-radius: 8px;">
                <i class="fa-solid fa-eye"></i> Review Order
            </button>
        </div>
    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function setTradeType(type, element) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            const reviewBtn = document.getElementById('review-order-btn');
            if (type === 'sell') {
                reviewBtn.style.backgroundColor = 'var(--red-color)';
                reviewBtn.style.color = '#fff';
            } else {
                reviewBtn.style.backgroundColor = 'var(--accent-color)';
                reviewBtn.style.color = '#000';
            }
        }
    </script>
</body>
</html>
